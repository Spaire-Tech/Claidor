services:
  redis:
    image: redis
    ports:
      - "${CLAIDOR_REDIS_PORT}:6379"

  db:
    image: postgres:15.1-bullseye
    environment:
      - POSTGRES_USER=${CLAIDOR_POSTGRES_USER}
      - POSTGRES_PASSWORD=${CLAIDOR_POSTGRES_PWD}
      - POSTGRES_DB=${CLAIDOR_POSTGRES_DATABASE}
      - POSTGRES_PORT=${CLAIDOR_POSTGRES_PORT}
      - CLAIDOR_READ_USER=${CLAIDOR_POSTGRES_READ_USER:-claidor_read}
      - CLAIDOR_READ_PASSWORD=${CLAIDOR_POSTGRES_READ_PWD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init-readonly-user.sql:/docker-entrypoint-initdb.d/init-readonly-user.sql
    ports:
      - "${CLAIDOR_POSTGRES_PORT}:5432"
    expose:
      - ${CLAIDOR_POSTGRES_PORT}
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-d",
          "${CLAIDOR_POSTGRES_DATABASE}",
          "-U",
          "${CLAIDOR_POSTGRES_USER}",
        ]
      timeout: 40s
      interval: 2s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2024.5.28
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio_data:/minio"
    environment:
      - MINIO_ROOT_USER=${CLAIDOR_MINIO_USER}
      - MINIO_ROOT_PASSWORD=${CLAIDOR_MINIO_PWD}

  minio-setup:
    image: bitnamilegacy/minio-client:2024.5.24
    depends_on:
      - minio
    volumes:
      - ./.minio:/tmp/config
    environment:
      - MINIO_HOST=minio
      - MINIO_ROOT_USER=${CLAIDOR_MINIO_USER}
      - MINIO_ROOT_PASSWORD=${CLAIDOR_MINIO_PWD}
      - BUCKET_NAME=${CLAIDOR_S3_FILES_BUCKET_NAME}
      - PUBLIC_BUCKET_NAME=${CLAIDOR_S3_FILES_PUBLIC_BUCKET_NAME}
      - BUCKET_TESTING_NAME=testing-${CLAIDOR_S3_FILES_BUCKET_NAME}
      - POLICY_FILE=/tmp/config/policy.json
      - ACCESS_KEY=${CLAIDOR_AWS_ACCESS_KEY_ID}
      - SECRET_ACCESS_KEY=${CLAIDOR_AWS_SECRET_ACCESS_KEY}
    entrypoint:
      [
        "bash",
        "-c",
        "chmod +x /tmp/config/local.sh && chmod +x /tmp/config/configure.sh && /tmp/config/local.sh /tmp/config/configure.sh",
      ]

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=claidor
      - GF_SECURITY_ADMIN_PASSWORD=claidor
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring

  tinybird:
    image: tinybirdco/tinybird-local:latest
    platform: linux/amd64
    ports:
      - "7181:7181"
      - "7182:7182"

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  minio_data:
    driver: local
  prometheus_data:
  grafana_data:
