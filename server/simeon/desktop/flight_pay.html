<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Paying for your flight · Simeon</title>
<!--
  The page the cloud computer pays a flight on (simeon/desktop/flight_booking.py,
  13 October 2026). Simeon's engine opens it in the agent's own Chrome with a
  Duffel component client key in the address's fragment (never sent to a
  server), types the person's one-time Link card into Duffel's card form (an
  iframe on api.duffel.cards: the card never touches Simeon's servers), and
  drives the steps below through `window.simeonPay`. A bank check (3-D Secure)
  that needs the person shows here, on the computer they can open from the
  chat. Every call mirrors Duffel's own components (@duffel/components 3.17.0:
  the card form's messages, `three_d_secure_sessions` and Evervault's check).
-->
<style>
:root{--ground:#fcfcfc;--ink:#141414;--ink2:rgba(20,20,20,.6);--edge:rgba(20,20,20,.08);--form:#ffffff}
@media (prefers-color-scheme:dark){:root{--ground:#141414;--ink:#f5f5f5;--ink2:rgba(245,245,245,.6);--edge:rgba(245,245,245,.12);--form:#ffffff}}
html,body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
#what{color:var(--ink2);margin:0 0 20px}
#note{margin:0 0 16px;min-height:22px}
#form{background:var(--form);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
#form iframe{display:block;width:100%;border:0;height:838px}
#form:empty{display:none}
</style>
</head>
<body>
<main>
<h1>Paying for your flight</h1>
<p id="what"></p>
<p id="note" role="status">Getting the payment form ready…</p>
<div id="form"></div>
</main>
<script>
(() => {
  "use strict";
  const CARDS = "https://api.duffel.cards";
  const API = "https://api.duffel.com";
  // Duffel's Evervault app for the bank check: live, and test mode's own (`live_mode` false).
  const LIVE = { team: "team_a22f3ea22207", app: "app_d1d607aedf2d" };
  const TEST = { team: "team_a22f3ea22207", app: "app_152d304a3d98" };

  const given = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  const key = given.get("key") || "";
  const note = document.getElementById("note");
  document.getElementById("what").textContent = given.get("what") || "";

  const state = { phase: "loading", valid: false, card: null, session: null, error: null };
  const say = (text) => { note.textContent = String(text || ""); };
  const fail = (text) => { state.phase = "failed"; state.error = text; say(text); };
  const plain = (value, fallback) => {
    const error = value && (Array.isArray(value.errors) ? value.errors[0] : value);
    const text = error && (error.message || error.title);
    return typeof text === "string" && text.length > 0 ? text : fallback;
  };

  // The card form's token is the client key's own claim (`token`), as Duffel's component reads it.
  let token = "";
  try {
    const part = key.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    token = JSON.parse(atob(part + "===".slice((part.length + 3) % 4))).token || "";
  } catch (error) { token = ""; }

  const frame = document.createElement("iframe");
  frame.title = "Card payment form";
  if (token) {
    const url = new URL("/vault/create_card_for_temporary_use", CARDS);
    url.searchParams.set("token", token);
    frame.src = url.href;
    document.getElementById("form").appendChild(frame);
  } else {
    fail("This payment page was opened without its key.");
  }

  let pending = null;
  window.addEventListener("message", (event) => {
    if (event.origin !== CARDS || !event.data || !event.data.type) return;
    const data = event.data;
    switch (data.type) {
      case "iframe-loaded":
        if (frame.contentWindow) frame.contentWindow.postMessage({ type: "apply-styles", styles: undefined }, CARDS);
        if (state.phase === "loading") state.phase = "form";
        return;
      case "content-height-ready":
        if (typeof data.height === "number" && data.height > 0) frame.style.height = data.height + "px";
        if (state.phase === "loading") state.phase = "form";
        return;
      case "validate-success": state.valid = true; return;
      case "validate-failure": state.valid = false; return;
      case "create-card-for-temporary-use-success":
        state.card = data.data || null;
        if (pending) { const done = pending; pending = null; done({ ok: true, card: state.card }); }
        return;
      case "create-card-for-temporary-use-failure":
        if (pending) { const done = pending; pending = null; done({ ok: false, error: plain(data.error, "The card form refused the card.") }); }
        return;
      case "security-policy-violation":
        state.error = "The card form was blocked by a security rule (" + ((data.data && data.data.violated_directive) || "unknown") + ").";
        return;
      default:
        return;
    }
  });

  // The card in the form becomes a card id Duffel keeps for 25 minutes.
  const createCard = () => new Promise((resolve) => {
    if (!frame.contentWindow || state.phase === "loading") { resolve({ ok: false, error: "The card form isn't loaded." }); return; }
    const timer = setTimeout(() => { if (pending) { pending = null; resolve({ ok: false, error: "The card form didn't answer." }); } }, 60000);
    pending = (answer) => { clearTimeout(timer); resolve(answer); };
    say("Checking the card…");
    frame.contentWindow.postMessage({ type: "create-card-for-temporary-use" }, CARDS);
  });

  const call = async (path, body) => {
    const response = await fetch(API + path, {
      method: "POST",
      headers: { "Duffel-Version": "v2", "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const json = await response.json().catch(() => ({}));
    return { status: response.status, json };
  };
  const refresh = async (id) => {
    for (let attempt = 0; attempt < 2; attempt += 1) {
      const answer = await call("/three_d_secure_sessions/" + encodeURIComponent(id) + "/actions/refresh").catch(() => ({ status: 0, json: {} }));
      if (answer.status > 0 && answer.status < 500) return (answer.json && answer.json.data) || null;
    }
    return null;
  };
  const loadEvervault = () => new Promise((resolve, reject) => {
    if (window.Evervault) { resolve(); return; }
    const script = document.createElement("script");
    script.src = "https://js.evervault.com/v2";
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("The bank check couldn't load."));
    document.body.appendChild(script);
  });
  const settle = (session, otherwise) => {
    if (session) state.session = session;
    if (session && session.status === "ready_for_payment") { state.phase = "ready"; say("Card confirmed."); return; }
    fail(session && session.status === "expired" ? "The bank check ran out of time." : otherwise);
  };

  // The bank check for this card and this flight (3-D Secure). Most cards pass
  // without a word; some banks show their own check, which the person answers
  // here on the computer.
  const verify = async (offerId, cardId) => {
    state.phase = "verifying";
    say("Confirming the card with the bank…");
    try {
      const created = await call("/three_d_secure_sessions", { data: { card_id: cardId, resource_id: offerId, services: [], cardholder_present: true, exception: "" } });
      if (created.status !== 201 || !created.json || !created.json.data) { fail(plain(created.json, "The bank check couldn't start.")); return; }
      const session = created.json.data;
      state.session = session;
      if (session.status === "ready_for_payment") { settle(session, ""); return; }
      if (!session.client_id) { fail("The bank check couldn't start."); return; }
      await loadEvervault();
      const app = session.live_mode === false ? TEST : LIVE;
      state.phase = "challenge";
      say("Your bank wants to confirm it's you. Follow its steps on this page.");
      const check = new window.Evervault(app.team, app.app).ui.threeDSecure(session.client_id);
      check.on("success", async () => settle(await refresh(session.id), "The bank didn't confirm the card."));
      check.on("failure", async () => settle(await refresh(session.id), "The bank didn't confirm the card."));
      check.on("error", async () => { await refresh(session.id); fail("The bank check failed."); });
      check.mount();
    } catch (error) {
      fail(error && error.message ? error.message : "The bank check failed.");
    }
  };

  window.simeonPay = {
    status: () => JSON.parse(JSON.stringify(state)),
    createCard,
    verify: (offerId, cardId) => { void verify(String(offerId), String(cardId)); return true; },
    say,
  };
})();
</script>
</body>
</html>
