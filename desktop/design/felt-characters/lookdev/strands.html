<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felt Strands Lookdev</title>
<style>
  :root { --bg:#e6edf7; --ink:#1b2130; --muted:#5a6477; --panel:rgba(255,255,255,.8); --line:rgba(20,30,50,.14); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f131b; --ink:#e7ebf3; --muted:#9aa4b8; --panel:rgba(18,22,30,.8); --line:rgba(255,255,255,.14); }
  }
  :root[data-theme="dark"] { --bg:#0f131b; --ink:#e7ebf3; --muted:#9aa4b8; --panel:rgba(18,22,30,.8); --line:rgba(255,255,255,.14); }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  canvas#c { display:block; width:100vw; height:100vh; touch-action:none; }
  .ui { position:fixed; left:16px; top:16px; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 32px); }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .sw { width:22px; height:22px; border-radius:50%; border:2px solid var(--panel); box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }
  .sw[aria-pressed="true"] { box-shadow:0 0 0 2px var(--ink); }
  .btn { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer; font:inherit; }
  .btn[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  #hud { position:fixed; left:16px; bottom:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font:11px/1.45 ui-monospace, Menlo, monospace; white-space:pre; color:var(--ink); }
  body.clean .ui, body.clean #hud { display:none; }
  #thumbs { position:fixed; inset:0; display:none; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="row" id="swatches" aria-label="Body colour"></div>
  <div class="row" id="views" aria-label="Camera"></div>
  <div class="row" id="lods" aria-label="Level of detail"></div>
</div>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three';

/* =====================================================================================
   Simeon felt character look-dev — technique: real instanced strands over a velvet
   underlayer.

   Pipeline
   1. Shapes are signed distance fields (head+ears+muzzle+nose+brows fused with smooth
      unions, body+arms+feet, a knitted sweater shell). Each is polygonised once with
      naive surface nets; ambient occlusion is baked per vertex from the whole-scene SDF.
   2. Eyelids are parametric shells swept around each eye's horizontal axis, so a blink
      is a single rotation. Eyes are spheres with a refracted iris and a studio
      reflection.
   3. Tens of thousands of strands are grown from area-sampled roots. Each strand is an
      instance of one tiny ribbon template; the curve (lean, bend, crimp) is evaluated
      in the vertex shader, camera facing, clamped to a minimum pixel width with the
      lost coverage moved into alpha. Shading: Kajiya-Kay diffuse + two shifted
      specular lobes, a back-light transmission lobe, root-to-tip occlusion.
   4. Strands follow "bones" (body, head, four lids) through a mat4 uniform array, so
      breathing, blinking and gaze are just transform updates.
   5. LOD: strands are shuffled at build time, so drawing the first N instances is a
      uniform subsample; width grows as the count drops.
   ===================================================================================== */

const Q = new URLSearchParams(location.search);
const qnum = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);
if (Q.has('clean')) document.body.classList.add('clean');

// ------------------------------------------------------------------ cost knobs
const KNOBS = {
  pixelRatio: Math.min(qnum('pr', window.devicePixelRatio || 1), 2),
  shadowSize: 2048,
  shortSegments: 3,     // ribbon segments for coat fibres
  longSegments: 10,     // ribbon segments for flyaways, tuft, mohair
  sdfCell: { head: 0.016, body: 0.02, sweater: 0.013 },
  // hero strand budget per character (instances). LOD tiers draw a prefix of these.
  budget: {
    headCoat: 52000, headFly: 2200, tuft: 700, lidCoat: 3200, lowerLid: 700,
    bodyCoat: 9000, bodyFly: 350, knitFuzz: 18000, mohair: 4500,
  },
  tiers: [ // min on-screen height in device px -> fraction of strands drawn
    { name: 'hero',   minPx: 700, frac: 1.0 },
    { name: 'large',  minPx: 360, frac: 0.45 },
    { name: 'medium', minPx: 170, frac: 0.18 },
    { name: 'small',  minPx: 70,  frac: 0.07 },
    { name: 'tiny',   minPx: 0,   frac: 0.025 },
  ],
};

// ------------------------------------------------------------------ palette
const PAL = {
  black:  ['#000000', '#4A4A50', '#1C1C20'],
  brown:  ['#936439', '#AE8968', '#855C36'],
  red:    ['#FF263C', '#FF5667', '#E02135'],
  orange: ['#FF6700', '#FF8838', '#E05B00'],
  yellow: ['#FF9800', '#FFAF38', '#E08600'],
  green:  ['#00C972', '#1CCF82', '#009957'],
  cyan:   ['#00BCA6', '#58D3C5', '#00A592'],
  blue:   ['#1084FE', '#459FFE', '#0E74E0'],
  violet: ['#9159FE', '#B792FE', '#804EE0'],
  magenta:['#FF309B', '#FF77BE', '#E02A88'],
  gray:   ['#777777', '#A6A6A6', '#696969'],
};
const hex3 = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
const mixS = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const lumS = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
const desatS = (c, t) => { const l = lumS(c); return c.map((v) => v + (l - v) * t); };
const lin = (c) => new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);

function scheme(id) {
  const [b, f, t] = PAL[id].map(hex3);
  const black = id === 'black';
  const fur = black ? hex3('#2C2C31') : b;                       // black renders as charcoal felt
  const furLight = black ? hex3('#7D7D86') : mixS(f, hex3('#FFF6EA'), 0.6);
  const furDark = black ? hex3('#121215') : mixS(t, [0, 0, 0], 0.52);
  const brow = black ? hex3('#18181B') : mixS(t, [0, 0, 0], 0.22);
  const warm = ['orange', 'red', 'yellow'].includes(id);
  const yarn = warm ? hex3('#1084FE') : hex3('#FF6700');
  const yarnLight = warm ? hex3('#459FFE') : hex3('#FF8838');
  const bgBase = black ? hex3('#9A9CA3') : f;
  const bg = mixS(desatS(bgBase, 0.42), hex3('#EEF1F5'), 0.36);
  return { fur, furLight, furDark, brow, yarn, yarnLight, bg };
}

// ------------------------------------------------------------------ small math / rng
const { sqrt, abs, min, max, sin, cos, atan2, PI } = Math;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rngOf(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const v3 = (x, y, z) => [x, y, z];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = (a) => sqrt(vdot(a, a));
const vnorm = (a) => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// smooth 3D value noise (for fur flow / clumping fields)
function hash3(i, j, k) { let h = (i * 374761393 + j * 668265263 + k * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, z) {
  const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z);
  const fx = x - i, fy = y - j, fz = z - k;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const L = (a, b, t) => a + (b - a) * t;
  return L(L(L(hash3(i, j, k), hash3(i + 1, j, k), ux), L(hash3(i, j + 1, k), hash3(i + 1, j + 1, k), ux), uy),
           L(L(hash3(i, j, k + 1), hash3(i + 1, j, k + 1), ux), L(hash3(i, j + 1, k + 1), hash3(i + 1, j + 1, k + 1), ux), uy), uz);
}
// felted wool is not combed: fibres swirl in coherent patches. Returns [swirl angle, lean mult, length mult]
function woolField(p) {
  const a = vnoise(p[0] * 9 + 3.1, p[1] * 9, p[2] * 9) * 0.65 + vnoise(p[0] * 23, p[1] * 23 + 7.7, p[2] * 23) * 0.35;
  const b = vnoise(p[0] * 17 + 11, p[1] * 17, p[2] * 17 + 5);
  const c = vnoise(p[0] * 31, p[1] * 31 + 2, p[2] * 31 + 9);
  return [(a - 0.5) * 5.0, 0.75 + 0.6 * b, 0.7 + 0.6 * c];
}

// ------------------------------------------------------------------ SDF primitives
function sdSph(x, y, z, c, r) { const dx = x - c[0], dy = y - c[1], dz = z - c[2]; return sqrt(dx * dx + dy * dy + dz * dz) - r; }
function sdEll(x, y, z, c, r) {
  const px = (x - c[0]) / r[0], py = (y - c[1]) / r[1], pz = (z - c[2]) / r[2];
  const k0 = sqrt(px * px + py * py + pz * pz);
  const qx = px / r[0], qy = py / r[1], qz = pz / r[2];
  const k1 = sqrt(qx * qx + qy * qy + qz * qz);
  return k1 < 1e-9 ? -min(r[0], r[1], r[2]) : (k0 * (k0 - 1)) / k1;
}
function sdCap(x, y, z, a, b, r) {
  const pax = x - a[0], pay = y - a[1], paz = z - a[2];
  const bax = b[0] - a[0], bay = b[1] - a[1], baz = b[2] - a[2];
  let h = (pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz);
  h = h < 0 ? 0 : h > 1 ? 1 : h;
  const dx = pax - bax * h, dy = pay - bay * h, dz = paz - baz * h;
  return sqrt(dx * dx + dy * dy + dz * dz) - r;
}
function sdRoundCone(qx, py, r1, r2, h) { // qx = radial distance from axis, py = along axis
  const b = (r1 - r2) / h, a = sqrt(1 - b * b);
  const k = qx * -b + py * a;
  if (k < 0) return sqrt(qx * qx + py * py) - r1;
  if (k > a * h) return sqrt(qx * qx + (py - h) * (py - h)) - r2;
  return qx * a + py * b - r1;
}
function smin(a, b, k) { const h = max(k - abs(a - b), 0) / k; return min(a, b) - h * h * k * 0.25; }
function smax(a, b, k) { return -smin(-a, -b, k); }
function boxDist(x, y, z, bb) { // distance to an AABB (0 inside) — a cheap lower bound
  const dx = max(bb[0] - x, 0, x - bb[3]), dy = max(bb[1] - y, 0, y - bb[4]), dz = max(bb[2] - z, 0, z - bb[5]);
  return sqrt(dx * dx + dy * dy + dz * dz);
}

// ------------------------------------------------------------------ the character's shape (units: head radius ~ 1)
const HC = [0, 2.32, 0];
const at = (dx, dy, dz) => [HC[0] + dx, HC[1] + dy, HC[2] + dz];
const SHAPE = {
  head: { c: at(0, 0.02, 0), r: [1.1, 0.93, 0.97] },
  cheeks: [[at(-0.5, -0.3, 0.26), 0.56], [at(0.5, -0.3, 0.26), 0.56]],
  muzzle: { c: at(0, -0.31, 0.79), r: [0.44, 0.28, 0.3] },
  nose: { c: at(0, -0.1, 1.06), r: [0.155, 0.105, 0.11] },
  eyeR: 0.2,
  eyes: [at(-0.37, 0.12, 0.8), at(0.37, 0.12, 0.8)],
  ears: [
    { base: at(-0.58, 0.62, -0.08), tip: at(-0.94, 1.2, -0.16), r1: 0.37, r2: 0.17, flat: 0.55, yaw: -0.25 },
    { base: at(0.58, 0.62, -0.08), tip: at(0.94, 1.2, -0.16), r1: 0.37, r2: 0.17, flat: 0.55, yaw: 0.25 },
  ],
  brows: [ // capsule a->b radius
    { a: at(-0.58, 0.45, 0.72), b: at(-0.22, 0.37, 0.86), r: 0.05 },
    { a: at(0.58, 0.45, 0.72), b: at(0.22, 0.37, 0.86), r: 0.05 },
  ],
  mouth: [
    { a: at(0, -0.2, 1.075), b: at(0, -0.33, 1.07), r: 0.014 },
    { a: at(0, -0.33, 1.065), b: at(-0.11, -0.37, 1.04), r: 0.015 },
    { a: at(0, -0.33, 1.065), b: at(0.11, -0.37, 1.04), r: 0.015 },
  ],
  // body
  torsoLow: [[0, 0.74, 0], 0.72], torsoUp: [[0, 1.06, 0.0], 0.47],
  neck: { a: [0, 0.95, 0], b: [0, 1.6, 0], r: 0.27 },
  arms: [
    { s: [-0.5, 1.08, 0.03], w: [-0.8, 0.55, 0.16], r: 0.15 },
    { s: [0.5, 1.08, 0.03], w: [0.8, 0.55, 0.16], r: 0.15 },
  ],
  paws: [[[-0.84, 0.45, 0.19], [0.16, 0.15, 0.16]], [[0.84, 0.45, 0.19], [0.16, 0.15, 0.16]]],
  feet: [[[-0.33, 0.1, 0.24], [0.24, 0.13, 0.3]], [[0.33, 0.1, 0.24], [0.24, 0.13, 0.3]]],
  // sweater
  knitThick: 0.045, hemY: 0.34, hemBand: 0.11, cuffLen: 0.1, sleeveEnd: 0.8, // fraction of shoulder->wrist
  collar: { c: [0, 1.29, 0.0], R: 0.305, r: 0.075 },
};
// ear frames (s = side, u = axis, f = front)
for (const e of SHAPE.ears) {
  e.u = vnorm(vsub(e.tip, e.base)); e.h = vlen(vsub(e.tip, e.base));
  let f = [sin(e.yaw), 0.18, cos(e.yaw)]; f = vnorm(vsub(f, vmul(e.u, vdot(f, e.u))));
  e.f = f; e.s = vcross(e.u, f);
  e.dish = { c: vadd(vadd(e.base, vmul(e.u, e.h * 0.52)), vmul(e.f, e.r1 * e.flat * 0.95)), r: [e.r1 * 0.6, e.h * 0.46, 0.13] };
}
const EYE_N = SHAPE.eyes.map((c) => { // outward socket normal ~ ellipsoid normal
  const r = SHAPE.head.r, p = vsub(c, SHAPE.head.c);
  return vnorm([p[0] / (r[0] * r[0]), p[1] / (r[1] * r[1]), p[2] / (r[2] * r[2])]);
});

function earSDF(x, y, z, e, withDish) {
  const qx0 = x - e.base[0], qy0 = y - e.base[1], qz0 = z - e.base[2];
  const ls = qx0 * e.s[0] + qy0 * e.s[1] + qz0 * e.s[2];
  const lu = qx0 * e.u[0] + qy0 * e.u[1] + qz0 * e.u[2];
  const lf = (qx0 * e.f[0] + qy0 * e.f[1] + qz0 * e.f[2]) / e.flat;
  let d = sdRoundCone(sqrt(ls * ls + lf * lf), lu, e.r1, e.r2, e.h) * e.flat;
  if (withDish) {
    // dish in ear-local space (s,u,f)
    const dx = x - e.dish.c[0], dy = y - e.dish.c[1], dz = z - e.dish.c[2];
    const ds = dx * e.s[0] + dy * e.s[1] + dz * e.s[2], du = dx * e.u[0] + dy * e.u[1] + dz * e.u[2], df = dx * e.f[0] + dy * e.f[1] + dz * e.f[2];
    const dd = sdEll(ds, du, df, [0, 0, 0], e.dish.r);
    d = smax(d, -dd, 0.05);
    return [d, dd];
  }
  return [d, 1];
}

// Head SDF. If reg (Float32Array(4)) is given, fills region weights [base, light, dark, brow].
function headSDF(x, y, z, reg) {
  const S = SHAPE;
  let d = sdEll(x, y, z, S.head.c, S.head.r);
  for (const [c, r] of S.cheeks) d = smin(d, sdSph(x, y, z, c, r), 0.36);
  const dm = sdEll(x, y, z, S.muzzle.c, S.muzzle.r); d = smin(d, dm, 0.2);
  const dn = sdEll(x, y, z, S.nose.c, S.nose.r); d = smin(d, dn, 0.035);
  let dDish = 9, dEarNoDish = 9;
  for (const e of S.ears) {
    const [de, dd] = earSDF(x, y, z, e, true);
    d = smin(d, de, 0.17);
    if (dd < dDish) dDish = dd;
    const [dn2] = earSDF(x, y, z, e, false); if (dn2 < dEarNoDish) dEarNoDish = dn2;
  }
  let dBrow = 9;
  for (const b of S.brows) { const db = sdCap(x, y, z, b.a, b.b, b.r); dBrow = min(dBrow, db); }
  d = smin(d, dBrow, 0.06);
  for (const c of S.eyes) d = smax(d, -(sdSph(x, y, z, c, S.eyeR + 0.012)), 0.05);
  let dMouth = 9;
  for (const m of S.mouth) dMouth = min(dMouth, sdCap(x, y, z, m.a, m.b, m.r));
  d = smax(d, -dMouth, 0.018);
  if (reg) {
    const wN = sstep(0.02, 0.0, dn);
    const wMo = sstep(0.03, 0.012, dMouth) * 0.7;
    const wM = sstep(0.085, 0.045, dm) * (1 - wN);
    const wE = sstep(0.03, -0.005, dDish) * sstep(0.06, 0.0, dEarNoDish);
    const wB = sstep(0.012, -0.012, dBrow) * (1 - wN);
    const light = max(wM, wE) * (1 - wMo);
    const dark = max(wN, wMo);
    reg[1] = light; reg[2] = dark; reg[3] = wB * (1 - dark);
    reg[0] = max(0, 1 - reg[1] - reg[2] - reg[3]);
  }
  return d;
}

function torsoSDF(x, y, z) {
  const S = SHAPE;
  return smin(sdSph(x, y, z, S.torsoLow[0], S.torsoLow[1]), sdSph(x, y, z, S.torsoUp[0], S.torsoUp[1]), 0.45);
}
function bodySDF(x, y, z) {
  const S = SHAPE;
  let d = torsoSDF(x, y, z);
  d = smin(d, sdCap(x, y, z, S.neck.a, S.neck.b, S.neck.r), 0.18);
  for (const a of S.arms) d = smin(d, sdCap(x, y, z, a.s, a.w, a.r), 0.12);
  for (const [c, r] of S.paws) d = smin(d, sdEll(x, y, z, c, r), 0.07);
  for (const [c, r] of S.feet) d = smin(d, sdEll(x, y, z, c, r), 0.14);
  return d;
}
const ARM_AX = SHAPE.arms.map((a) => ({ a: a.s, b: a.w, dir: vnorm(vsub(a.w, a.s)), len: vlen(vsub(a.w, a.s)) }));
// Sweater SDF. knit (Float32Array(4)) receives [sleeveL, sleeveR, rib, collar] weights.
function sweaterSDF(x, y, z, knit) {
  const S = SHAPE, T = S.knitThick;
  // torso shell, cut at hem and neck
  let dt = torsoSDF(x, y, z) - T;
  dt = smax(dt, S.hemY - y, 0.02);
  dt = smax(dt, -(sqrt(x * x + (z - 0.0) * (z - 0.0)) - (S.collar.R - 0.02)), 0.04); // neck hole
  dt = smax(dt, y - 1.45, 0.05);
  // hem rib band: slightly proud ring
  let dh = torsoSDF(x, y, z) - T - 0.018;
  dh = smax(dh, abs(y - (S.hemY + S.hemBand * 0.5)) - S.hemBand * 0.5, 0.03);
  // sleeves
  let dsl = 9, dcf = 9, sl = [0, 0];
  for (let i = 0; i < 2; i++) {
    const A = ARM_AX[i], a = S.arms[i];
    const end = vadd(A.a, vmul(A.dir, A.len * S.sleeveEnd));
    let ds = sdCap(x, y, z, vadd(A.a, vmul(A.dir, -0.05)), end, a.r + T + 0.012);
    const along = (x - A.a[0]) * A.dir[0] + (y - A.a[1]) * A.dir[1] + (z - A.a[2]) * A.dir[2];
    ds = smax(ds, along - A.len * S.sleeveEnd, 0.02);
    let dc = sdCap(x, y, z, vadd(A.a, vmul(A.dir, A.len * S.sleeveEnd - S.cuffLen)), end, a.r + T + 0.03);
    dc = smax(dc, along - A.len * S.sleeveEnd, 0.02);
    dc = smax(dc, A.len * S.sleeveEnd - S.cuffLen - along, 0.02);
    if (ds < dsl) dsl = ds; if (dc < dcf) dcf = dc;
    sl[i] = min(ds, dc);
  }
  // rolled collar torus
  const C = S.collar;

  vec3 Cs[3]; Cs[0]=uKeyCol*sh; Cs[1]=uFillCol; Cs[2]=uRimCol;
  for (int i=0;i<3;i++){ float NoL = dot(N, Ls[i]); col += alb*max(0.,(NoL+.25)/1.25)*Cs[i]; }
  col += alb*hemi(N);
  col *= lidAO;
  // wet cornea: fresnel reflection of the studio + a tight key highlight
  vec3 R = reflect(-V, N);
  float F = 0.045 + 0.955*pow(1.-NoV, 5.);
  vec3 env = studioEnv(R);
  float spec = pow(max(dot(R, uKeyDir),0.), 900.)*18.;
  col = col*(1.-F) + env*F*mix(0.45,1.,lidAO) + uKeyCol*spec*0.25*sh*lidAO;
  // wet meniscus where the lower lid meets the eye: a thin bright line
  float men = smoothstep(0.07, 0.0, bl - uLowEdge) * smoothstep(-0.02, 0.01, bl - uLowEdge);
  col += vec3(0.9,0.95,1.)*men*0.22*pow(max(dot(R, normalize(vec3(0.,0.6,1.))),0.),4.);
  gl_FragColor = vec4(col, 1.);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

// --- backdrop (cyclorama) with contact AO from analytic occluders
const BG_VS = /* glsl */`
varying vec3 vW; varying vec3 vN;
void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; vN = normalize(mat3(modelMatrix)*normal); gl_Position = projectionMatrix*viewMatrix*w; }`;
const BG_FS = /* glsl */`
${GLSL_LIGHT}
uniform vec3 uBg; uniform vec3 uBgFloor; uniform vec4 uOcc[6]; uniform float uNOcc;
varying vec3 vW; varying vec3 vN;
float ign2(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }
void main(){
  vec3 N = normalize(vN);
  float wall = smoothstep(0.2, 3.5, vW.y);
  vec3 base = mix(uBgFloor, uBg, wall);
  // soft top-to-bottom studio falloff and a gentle vignette around the subject
  float r = length(vec2(vW.x*0.55, (vW.y-1.8)*0.8 + min(vW.z,0.)*0.0));
  base *= mix(1.06, 0.84, smoothstep(1.5, 9., r));
  float occ = 0.;
  for (int i=0;i<6;i++){ if (float(i) >= uNOcc) break; vec3 d = uOcc[i].xyz - vW; float l = length(d); float rr = uOcc[i].w;
    occ += rr*rr*max(dot(N, d/l), 0.)/(l*l) ; }
  float ao = 1. - 0.55*clamp(occ, 0., 1.);
  float sh = shadowAt(vW + N*0.02, 0.018, 0.7, 12);
  float key = max(dot(N, uKeyDir), 0.);
  vec3 col = base * (0.78 + 0.28*key*mix(0.55, 1., sh)) * ao;
  gl_FragColor = vec4(col, 1.);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

  }
  return { reg, ao };
}

function lidAttrs(g, frame) {
  const P = g.attributes.position.array, Nn = g.attributes.normal.array, n = P.length / 3;
  const reg = new Float32Array(n * 4), ao = new Float32Array(n);

    reg[4 * i] = 1;
    v.set(P[3 * i], P[3 * i + 1], P[3 * i + 2]).applyMatrix4(frame);
    nn.set(Nn[3 * i], Nn[3 * i + 1], Nn[3 * i + 2]).applyMatrix3(nm).normalize();
    // lids: AO only from the head (exclude the lid's own approx volume)

      const d = min(headSDF(px, py, pz), eyeSDF(px, py, pz) + 0.0);

}

{ // bake lid AO in head space using the left eye frame (both are mirror images)

// ------------------------------------------------------------------ strands
const shortSet = new StrandSet(), longSet = new StrandSet();
const BONE = { body: 0, head: 1, lidL: 2, lidR: 3, lowL: 4, lowR: 5 };
const REG = { fur: 0, light: 1, dark: 2, brow: 3, yarn: 4, yarnFuzz: 5, fly: 6, tuft: 7 };
const rng = rngOf(1234567);
const FACE_C = at(0, -0.16, 1.35);

function pickRegion(w, r) { const s = w[0] + w[1] + w[2] + w[3]; let x = r * s; for (let k = 0; k < 4; k++) { x -= w[k]; if (x <= 0) return k; } return 0; }
function nearEye(p) { let best = 9, bi = 0; SHAPE.eyes.forEach((c, i) => { const d = vlen(vsub(p, c)) - SHAPE.eyeR; if (d < best) { best = d; bi = i; } }); return [best, bi]; }
function underLid(p) { // inside the upper-lid shell region of either eye (at rest)
  return lidApproxSDF(p[0], p[1], p[2]) < 0.012;
}
function headFlow(p, n) {
  // fibres flow away from the face centre, up the ears towards the tips, around the eyes
  let d = vsub(p, FACE_C);
  for (const e of SHAPE.ears) {
    const q = vsub(p, e.base); const along = vdot(q, e.u);
    const w = sstep(-0.05, 0.2, along) * sstep(0.7, 0.3, vlen(vsub(q, vmul(e.u, along))));
    d = vadd(vmul(d, 1 - w), vmul(e.u, w * 2));
  }
  const [de, ei] = nearEye(p);
  if (de < 0.2) { const away = vnorm(vsub(p, SHAPE.eyes[ei])); const w = sstep(0.2, 0.02, de); d = vadd(vmul(vnorm(d), 1 - w), vmul(away, w)); }
  return tangentize(vnorm(d), n);
}

timed('grow strands', () => {
  // ---- head coat
  {
    const m = headMesh, samp = makeSampler(m.P, m.idx);
    const reg = headAttr.reg, ao = headAttr.ao, w = new Float32Array(4);
    let made = 0, tries = 0;
    while (made < KNOBS.budget.headCoat && tries < KNOBS.budget.headCoat * 3) {
      tries++;
      const s = samp(rng);
      const p = bary(m.P, 3, s), n = vnorm(bary(m.N, 3, s)), rw = bary(reg, 4, s), a = bary(ao, 1, s)[0];
      if (bodySDF(p[0], p[1], p[2]) < -0.01 || sweaterSDF(p[0], p[1], p[2]) < 0.0) continue;
      const [de] = nearEye(p);
      if (de < 0.03 || underLid(p)) continue;
      const r = pickRegion(rw, rng());
      const eyeShort = sstep(0.03, 0.16, de);
      let len, width = 0.0042, lean = 0.75 + rng() * 0.75, bend = (rng() - 0.35) * 1.6, amp = 0.16 + rng() * 0.12, freq = 1.0 + rng() * 1.8, alpha = 0.95;
      if (r === REG.fur) len = 0.046 * (0.6 + rng() * 0.8);

      else if (r === REG.dark) { len = 0.016 * (0.6 + rng() * 0.8); width = 0.0036; lean = 0.5 + rng() * 0.6; amp = 0.1; }
      else { len = 0.036 * (0.6 + rng() * 0.8); }

      const wf = woolField(p);
      len *= wf[2]; lean = Math.min(lean * wf[1], 1.55);
      let dir = headFlow(p, n);
      dir = rotAround(dir, n, wf[0] * (r === REG.fur ? 1 : 0.5) + (rng() - 0.5) * 0.7);
      shortSet.add(p, n, dir, len, width, lean, bend, rng(), r, a, BONE.head, amp, freq, alpha);
      made++;
    }
    // ---- flyaways (long, sparse, wild)
    for (let i = 0, tries2 = 0; i < KNOBS.budget.headFly && tries2 < 20000; tries2++) {
      const s = samp(rng);
      const p = bary(m.P, 3, s), n = vnorm(bary(m.N, 3, s)), rw = bary(reg, 4, s), a = bary(ao, 1, s)[0];
      if (bodySDF(p[0], p[1], p[2]) < 0.02 || sweaterSDF(p[0], p[1], p[2]) < 0.05) continue;
      const [de] = nearEye(p); if (de < 0.12 || underLid(p) || rw[2] > 0.3) continue;

      const ds = sweaterSDF(p[0], p[1], p[2]);

      const wf = woolField(p);
      let dir = tangentize([0, -1, 0.3], n);
      dir = rotAround(dir, n, wf[0] + (rng() - 0.5) * 0.7);
      const len = 0.04 * (0.6 + rng() * 0.8) * wf[2] * (0.55 + 0.45 * sstep(0.0, 0.06, ds));

  }
  // ---- knit fuzz + mohair halo
  {
    const m = sweaterMesh, samp = makeSampler(m.P, m.idx), ao = sweaterAttr.ao;
    for (let i = 0; i < KNOBS.budget.knitFuzz; i++) {
      const s = samp(rng);
      const p = bary(m.P, 3, s), n = vnorm(bary(m.N, 3, s)), a = bary(ao, 1, s)[0];
      if (headSDF(p[0], p[1], p[2]) < 0.0) continue;
      const dir = tangentize([rng() - 0.5, rng() - 0.5, rng() - 0.5], n);
      shortSet.add(p, n, dir, 0.03 * (0.5 + rng()), 0.0032, 0.5 + rng() * 1.0, (rng() - 0.5) * 3, rng(), REG.yarnFuzz, a, BONE.body, 0.3 + rng() * 0.3, 0.8 + rng() * 1.6, 0.6);
    }
    for (let i = 0; i < KNOBS.budget.mohair; i++) {
      const s = samp(rng);
      const p = bary(m.P, 3, s), n = vnorm(bary(m.N, 3, s)), a = bary(ao, 1, s)[0];
      if (headSDF(p[0], p[1], p[2]) < 0.02) continue;
      const dir = tangentize([rng() - 0.5, rng() - 0.5, rng() - 0.5], n);
      longSet.add(p, n, dir, 0.05 + Math.pow(rng(), 2) * 0.1, 0.0028, 0.5 + rng() * 0.9, (rng() - 0.5) * 4, rng(), REG.yarnFuzz, a, BONE.body, 0.3 + rng() * 0.3, 0.5 + rng() * 1.2, 0.55);
    }
  }

const shortGeo = shortSet.build(KNOBS.shortSegments, rng);
const longGeo = longSet.build(KNOBS.longSegments, rng);
const shortMat = strandMaterial(), longMat = strandMaterial();
const shortMesh = new THREE.Mesh(shortGeo, shortMat), longMesh = new THREE.Mesh(longGeo, longMat);
for (const m of [shortMesh, longMesh]) { m.frustumCulled = false; m.renderOrder = 10; charRoot.add(m); }
longMesh.renderOrder = 11;
const BONES = () => [bodyBone, headBone, eyes[0].upper, eyes[1].upper, eyes[0].lower, eyes[1].lower];
if (Q.has('nostrands')) { shortMesh.visible = false; longMesh.visible = false; }

// ------------------------------------------------------------------ backdrop
function cycloramaGeometry() {
  const prof = []; // (z, y) from front floor to top of wall
  for (let i = 0; i <= 10; i++) prof.push([12 - i * 1.6, 0]);          // floor z: 12 -> -4
  for (let i = 1; i <= 24; i++) { const a = (i / 24) * (PI / 2); prof.push([-4 - sin(a) * 5, 5 - cos(a) * 5]); }
  for (let i = 1; i <= 6; i++) prof.push([-9, 5 + i * 4]);
  const xs = 24, pos = [], idx = [];
  for (let j = 0; j < prof.length; j++) for (let i = 0; i <= xs; i++) pos.push(-30 + (60 * i) / xs, prof[j][1], prof[j][0]);
  for (let j = 0; j < prof.length - 1; j++) for (let i = 0; i < xs; i++) { const a = j * (xs + 1) + i, b = a + xs + 1; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const bgMat = new THREE.ShaderMaterial({
  vertexShader: BG_VS, fragmentShader: BG_FS,
  uniforms: { ...SH, uBg: { value: new THREE.Color() }, uBgFloor: { value: new THREE.Color() },
    uOcc: { value: [
      new THREE.Vector4(...SHAPE.feet[0][0], 0.2), new THREE.Vector4(...SHAPE.feet[1][0], 0.2),
      new THREE.Vector4(0, 0.74, 0, 0.62), new THREE.Vector4(-0.84, 0.45, 0.19, 0.14), new THREE.Vector4(0.84, 0.45, 0.19, 0.14),
      new THREE.Vector4(0, 2.2, 0, 0.9)] }, uNOcc: { value: 6 } },
});
const backdrop = new THREE.Mesh(cycloramaGeometry(), bgMat); scene.add(backdrop);

// ------------------------------------------------------------------ colour
let currentColor = 'blue';
function setColor(id) {
  if (!PAL[id]) return;
  if (window.redraw && frozen !== null) setTimeout(window.redraw, 0);
  currentColor = id;
  const s = scheme(id);
  const pal = feltMat.uniforms.uPal.value;
  pal[0].copy(lin(s.fur)); pal[1].copy(lin(s.furLight)); pal[2].copy(lin(s.furDark)); pal[3].copy(lin(s.brow));
  knitMat.uniforms.uYarn.value.copy(lin(s.yarn)); knitMat.uniforms.uYarnLight.value.copy(lin(s.yarnLight));
  const sp = strandUniforms.uPal.value;
  sp[REG.fur].copy(lin(s.fur)); sp[REG.light].copy(lin(s.furLight)); sp[REG.dark].copy(lin(s.furDark)); sp[REG.brow].copy(lin(s.brow));
  sp[REG.yarn].copy(lin(s.yarn)); sp[REG.yarnFuzz].copy(lin(mixS(s.yarn, s.yarnLight, 0.7)));
  sp[REG.fly].copy(lin(mixS(s.fur, s.furLight, 0.55))); sp[REG.tuft].copy(lin(s.fur));
  bgMat.uniforms.uBg.value.copy(lin(s.bg)); bgMat.uniforms.uBgFloor.value.copy(lin(mixS(s.bg, [0, 0, 0], 0.08)));
  // bounce light takes the backdrop tint
  SH.uGroundCol.value.copy(lin(mixS(s.bg, [0, 0, 0], 0.4))).multiplyScalar(0.55);
  SH.uSkyCol.value.copy(lin(mixS(s.bg, [1, 1, 1], 0.55))).multiplyScalar(0.5);
  for (const e of eyes) {
    e.eyeMat.uniforms.uIris.value.copy(lin(hex3('#6CB4F4')));
    e.eyeMat.uniforms.uIrisDark.value.copy(lin(hex3('#12386E')));
    e.eyeMat.uniforms.uSclera.value.copy(lin(hex3('#F2EEE8')));
  }
  renderer.setClearColor(lin(s.bg));
  document.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
}

// ------------------------------------------------------------------ views
const VIEWS = {
  front:        { pos: [0, 1.95, 10.6], tgt: [0, 1.72, 0], fov: 28 },
  threequarter: { pos: [5.9, 2.45, 8.9], tgt: [0.05, 1.75, 0], fov: 28 },
  close:        { pos: [0.5, 2.5, 5.0], tgt: [0, 2.12, 0.5], fov: 28 },
  avatar:       { pos: [0, 2.35, 7.4], tgt: [0, 2.0, 0], fov: 28 },
  eyes:         { pos: [-0.62, 2.42, 2.35], tgt: [-0.36, 2.3, 0.82], fov: 22 },
  furedge:      { pos: [1.5, 3.05, 2.6], tgt: [1.02, 2.9, 0.05], fov: 20 },
  knit:         { pos: [1.6, 1.25, 3.5], tgt: [0.3, 0.9, 0.4], fov: 26 },
};
let currentView = 'front';
function setView(name) {
  const v = VIEWS[name]; if (!v) return;
  currentView = name;
  camera.position.set(...v.pos); camera.fov = v.fov; camera.lookAt(...v.tgt); camera.updateProjectionMatrix();
  document.querySelectorAll('#views .btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === name)));
}

// ------------------------------------------------------------------ LOD
let lodMode = Q.get('lod') || 'auto', lodTier = 'hero';
function applyLOD(frac, name) {
  lodTier = name;
  for (const g of [shortGeo, longGeo]) g.instanceCount = Math.max(1, Math.floor(g.userData.total * frac));
  // fewer strands -> thicker ones, so coverage (count x width) holds
  strandUniforms.uWidthScale.value = Math.pow(1 / frac, 0.55);
  longMesh.visible = !Q.has('nostrands') && frac > 0.05;
}
function autoLOD(heightPx) {
  if (lodMode !== 'auto') { const t = KNOBS.tiers.find((x) => x.name === lodMode) || KNOBS.tiers[0]; applyLOD(t.frac, t.name); return; }
  const t = KNOBS.tiers.find((x) => heightPx >= x.minPx) || KNOBS.tiers[KNOBS.tiers.length - 1];
  applyLOD(t.frac, t.name);
}

// ------------------------------------------------------------------ animation
let frozen = Q.has('t') ? qnum('t', 0) : null;
let blinkAt = 2.2, blinkSeed = rngOf(99);
const gaze = { yaw: 0, pitch: -0.03 };
function blinkCurve(t) { // 0 open -> 1 closed -> 0, ~170 ms, with a slower opening
  if (t < 0 || t > 0.28) return 0;
  return t < 0.08 ? sstep(0, 0.08, t) : 1 - sstep(0.1, 0.28, t);
}
function animate(time) {
  const breath = sin(time * 2 * PI / 4.2);
  bodyBone.scale.set(1 + 0.008 * breath, 1 + 0.014 * breath, 1 + 0.008 * breath);
  headPivot.position.y = 1.3 + 0.012 * breath;
  headPivot.rotation.set(0.02 * sin(time * 0.7) - 0.03, 0.05 * sin(time * 0.43), 0.02 * sin(time * 0.31));
  // blink every 3-5.5 s
  let bl = 0;
  if (Q.has('blink')) bl = qnum('blink', 0);
  else { let tb = time % 4.6; bl = blinkCurve(tb - 2.2); }
  const lidRot = bl * (LID.blinkMax);
  for (const e of eyes) {
    e.upper.rotation.x = lidRot;
    e.lower.rotation.x = -bl * 0.12;
    const gy = gaze.yaw + 0.06 * sin(time * 0.53) , gp = gaze.pitch + 0.03 * sin(time * 0.37);
    e.eyeball.rotation.set(-gp, gy + e.side * 0.13, 0, 'YXZ');
  }
}

// ------------------------------------------------------------------ UI
const sw = document.getElementById('swatches');
for (const id of Object.keys(PAL)) {
  const b = document.createElement('button'); b.className = 'sw'; b.dataset.id = id; b.title = id; b.setAttribute('aria-label', id);
  b.style.background = `linear-gradient(135deg, ${PAL[id][1]}, ${PAL[id][2]})`; b.onclick = () => setColor(id); sw.append(b);
}
const vw = document.getElementById('views');
for (const id of Object.keys(VIEWS)) { const b = document.createElement('button'); b.className = 'btn'; b.dataset.id = id; b.textContent = id; b.onclick = () => setView(id); vw.append(b); }
const ld = document.getElementById('lods');
for (const id of ['auto', ...KNOBS.tiers.map((t) => t.name)]) { const b = document.createElement('button'); b.className = 'btn'; b.dataset.id = id; b.textContent = id; b.onclick = () => { lodMode = id; ld.querySelectorAll('.btn').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.id === id))); }; ld.append(b); }
ld.querySelector('[data-id="auto"]').setAttribute('aria-pressed', 'true');

// orbit (drag)
let drag = null, orbit = { yaw: 0, pitch: 0 };
canvas.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (!drag) return; orbit.yaw -= (e.clientX - drag[0]) * 0.006; orbit.pitch = clamp(orbit.pitch + (e.clientY - drag[1]) * 0.004, -0.4, 0.6); drag = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', () => { drag = null; });

// ------------------------------------------------------------------ frame
const hud = document.getElementById('hud');
const tmpV = new THREE.Vector3(), tmpM = new THREE.Matrix4();
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function frame(now) {
  const time = frozen !== null ? frozen : now / 1000;
  animate(time);
  // camera orbit around the view target
  const v = VIEWS[currentView];
  const tg = new THREE.Vector3(...v.tgt), p0 = new THREE.Vector3(...v.pos).sub(tg);
  p0.applyAxisAngle(new THREE.Vector3(0, 1, 0), orbit.yaw);
  camera.position.copy(tg).add(p0); camera.position.y += orbit.pitch * p0.length() * 0.5; camera.lookAt(tg);
  scene.updateMatrixWorld(true);
  SH.uCamPos.value.copy(camera.position);
  // bones
  const bones = BONES();
  for (let i = 0; i < 6; i++) strandUniforms.uBones.value[i].copy(bones[i].matrixWorld);
  // eyes: camera in eye-local space, lid inverse matrices
  for (const e of eyes) {
    tmpM.copy(e.eyeball.matrixWorld).invert();
    e.eyeMat.uniforms.uCamLocal.value.copy(camera.position).applyMatrix4(tmpM).divideScalar(SHAPE.eyeR);
    e.eyeMat.uniforms.uLidInv.value.copy(e.upper.matrixWorld).invert();
    e.eyeMat.uniforms.uLowInv.value.copy(e.lower.matrixWorld).invert();
  }
  // LOD from projected height
  const dist = camera.position.distanceTo(new THREE.Vector3(0, 1.75, 0));
  const hPx = (3.5 / (2 * dist * Math.tan((camera.fov * PI) / 360))) * renderer.domElement.height;
  autoLOD(hPx);
  strandUniforms.uViewH.value = renderer.domElement.height;
  // shadow pass
  const kd = SH.uKeyDir.value;
  shadowCam.position.set(kd.x * 9, 1.75 + kd.y * 9, kd.z * 9); shadowCam.lookAt(0, 1.75, 0); shadowCam.updateMatrixWorld(true);
  SH.uShadowMat.value.multiplyMatrices(shadowCam.projectionMatrix, shadowCam.matrixWorldInverse);
  scene.overrideMaterial = depthMat;
  renderer.setRenderTarget(shadowRT); renderer.clear(); renderer.render(scene, shadowCam);
  scene.overrideMaterial = null; renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  // hud
  const dt = now - last; last = now; fpsAcc += dt; fpsN++;
  if (fpsAcc > 500) { fps = (1000 * fpsN) / fpsAcc; fpsAcc = 0; fpsN = 0; }
  const info = renderer.info.render;
  hud.textContent = `strands ${(shortGeo.instanceCount + (longMesh.visible ? longGeo.instanceCount : 0)).toLocaleString()} / ${(shortGeo.userData.total + longGeo.userData.total).toLocaleString()}  lod ${lodTier} (${Math.round(hPx)}px)\n` +
    `tris ${info.triangles.toLocaleString()}  calls ${info.calls}  ${fps.toFixed(1)} fps  pr ${renderer.getPixelRatio()}\n` +
    `build ${Object.entries(timings).map(([k, v]) => k + ' ' + v).join(', ')} ms`;
  frameCount++;
  if (frozen !== null && frameCount >= maxFrames) { window.__done = true; looping = false; return; }
  requestAnimationFrame(frame);
}
let frameCount = 0, looping = true;
const maxFrames = qnum('frames', 2);
window.redraw = () => { frameCount = 0; if (!looping) { looping = true; requestAnimationFrame(frame); } };

// ------------------------------------------------------------------ api
window.setColor = setColor;
window.setView = (n) => { orbit = { yaw: 0, pitch: 0 }; setView(n); if (frozen !== null) window.redraw(); };
window.freeze = (t) => { frozen = t === undefined || t === null ? null : t; window.redraw(); };
window.setLOD = (n) => { lodMode = n; };
window.KNOBS = KNOBS;
setColor(Q.get('color') || 'blue');
setView(Q.get('angle') || Q.get('view') || 'front');
resize();
timings.total = Math.round(performance.now() - t0);
requestAnimationFrame(frame);
document.title = 'Felt Strands Lookdev';
window.__ready = true;
</script>
</body>
