<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felt Shells Lookdev</title>
<style>
  :root { --bg: #dfe8f5; --ink: #1d2433; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 12px/1.3 -apple-system, system-ui, sans-serif; color: var(--ink); }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 12px; bottom: 10px; opacity: .55; pointer-events: none; white-space: pre; }
  body.thumb #hud, body.list #hud { display: none; }
  #list { display: none; position: fixed; inset: 0; padding: 16px; box-sizing: border-box; background: #fff; }
  body.list #list { display: grid; grid-template-columns: repeat(2, 200px); gap: 10px 24px; align-content: start; }
  body.list #view { left: -9999px; width: 80px; height: 80px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .row canvas { width: 40px; height: 40px; border-radius: 10px; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<div id="list"></div>
<div id="hud"></div>
<script type="module">
import * as THREE from "three";

/* =====================================================================
   Params, cost knobs
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const qp = (k, d) => (Q.has(k) ? Q.get(k) : d);
const THUMB = Q.has("thumb");
const LIST = Q.has("list");
const KNOBS = {
  shells: +qp("shells", THUMB || LIST ? 16 : 56),      // head shell count
  strands: +qp("strands", THUMB || LIST ? 0.25 : 1),   // strand density multiplier
  pixelRatio: +qp("pr", THUMB || LIST ? 2 : Math.min(window.devicePixelRatio || 1, 2)),
  meshLOD: +qp("lod", 1),                               // 1 = full mesh density, 0.5 = half
};
if (THUMB) document.body.classList.add("thumb");
if (LIST) document.body.classList.add("list");

/* =====================================================================
   Palette (app character colours) and derived felt colours
   ===================================================================== */
const PALETTE = {
  black:   ["#000000", "#4a4a4f", "#1f1f22"],
  brown:   ["#936439", "#AE8968", "#855C36"],
  red:     ["#FF263C", "#FF5667", "#E02135"],
  orange:  ["#FF6700", "#FF8838", "#E05B00"],
  yellow:  ["#FF9800", "#FFAF38", "#E08600"],
  green:   ["#00C972", "#1CCF82", "#009957"],
  cyan:    ["#00BCA6", "#58D3C5", "#00A592"],
  blue:    ["#1084FE", "#459FFE", "#0E74E0"],
  violet:  ["#9159FE", "#B792FE", "#804EE0"],
  magenta: ["#FF309B", "#FF77BE", "#E02A88"],
  gray:    ["#777777", "#A6A6A6", "#696969"],
};
const hex3 = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const mix3 = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const lin = (s) => new THREE.Color().setRGB(s[0], s[1], s[2], THREE.SRGBColorSpace); // sRGB triple -> working (linear) colour
const lum3 = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
const sat3 = (c, s) => { const l = lum3(c); return c.map((v) => Math.min(1, Math.max(0, l + (v - l) * s))); };

function feltColours(id) {
  const [base, from, to] = PALETTE[id] || PALETTE.blue;
  let b = hex3(base), f = hex3(from), t = hex3(to);
  if (id === "black") { b = hex3("#2e2e33"); }            // black renders as soft charcoal felt
  const cream = hex3("#fff6ea");
  const patch = id === "black" ? hex3("#8d8d93") : id === "gray" ? hex3("#d9d9d9") : mix3(sat3(f, 0.9), cream, 0.45);
  const nose = id === "black" ? hex3("#151517") : sat3(mix3(t, [0, 0, 0], 0.55), 1.1);
  const bgA = mix3(sat3(f, 0.55), [1, 1, 1], 0.62);       // backdrop centre
  const bgB = mix3(sat3(t, 0.55), [1, 1, 1], 0.40);       // backdrop edge
  // sweater: orange family, except where the body itself is warm (keep contrast)
  const warm = ["orange", "yellow", "red"].includes(id);
  const knit = warm ? ["#1084FE", "#459FFE", "#0E74E0"].map(hex3) : ["#FF6700", "#FF8838", "#E05B00"].map(hex3);
  return { body: b, from: f, to: t, patch, nose, bgA, bgB, knit };
}

/* =====================================================================
   Renderer / scene / camera
   ===================================================================== */
const host = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance", preserveDrawingBuffer: LIST });
renderer.setPixelRatio(KNOBS.pixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.sortObjects = true;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 50);

/* =====================================================================
   Lights (shared uniforms, world space; direction = towards the light)
   ===================================================================== */
const V3 = THREE.Vector3;
const L = {
  keyDir: new V3(-0.62, 0.72, 0.62).normalize(), keyCol: new THREE.Color(1.0, 0.965, 0.93).multiplyScalar(2.05),
  fillDir: new V3(0.85, 0.12, 0.5).normalize(), fillCol: new THREE.Color(0.8, 0.88, 1.0).multiplyScalar(0.55),
  rimDir: new V3(0.55, 0.5, -0.72).normalize(), rimCol: new THREE.Color(1.0, 0.98, 0.96).multiplyScalar(1.9),
  rim2Dir: new V3(-0.72, 0.38, -0.6).normalize(), rim2Col: new THREE.Color(0.95, 0.97, 1.0).multiplyScalar(1.2),
  sky: new THREE.Color(0.5, 0.54, 0.62), ground: new THREE.Color(0.22, 0.2, 0.19),
  catchDir: new V3(-0.42, -0.06, 1.0).normalize(),
};
const U = {
  uKeyDir: { value: L.keyDir }, uKeyCol: { value: L.keyCol },
  uFillDir: { value: L.fillDir }, uFillCol: { value: L.fillCol },
  uRimDir: { value: L.rimDir }, uRimCol: { value: L.rimCol },
  uRim2Dir: { value: L.rim2Dir }, uRim2Col: { value: L.rim2Col },
  uSky: { value: L.sky }, uGround: { value: L.ground },
  uCatchDir: { value: L.catchDir },
  uTime: { value: 0 },
  uPC: { value: Array.from({ length: 8 }, () => new V3(0, -99, 0)) },  // shadow proxies (world ellipsoids)
  uPR: { value: Array.from({ length: 8 }, () => new V3(0.01, 0.01, 0.01)) },
  uPx: { value: 0.002 },  // world size of one pixel at unit distance (for strand width clamp)
  uNoise: { value: null },
};

/* 3D tiling value-noise texture, sampled for clumps / mottling (one fetch instead of 8 hashes) */
function makeNoise3D(N = 48) {
  const data = new Uint8Array(N * N * N);
  const rnd = new Float32Array(N * N * N);
  let s = 1234567;
  const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < rnd.length; i++) rnd[i] = r();
  // blur once for smoother value noise
  const idx = (x, y, z) => ((z + N) % N) * N * N + ((y + N) % N) * N + ((x + N) % N);
  for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let a = 0;
    for (let k = -1; k <= 1; k++) for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) a += rnd[idx(x + i, y + j, z + k)] * (i === 0 ? 2 : 1) * (j === 0 ? 2 : 1) * (k === 0 ? 2 : 1);
    data[idx(x, y, z)] = Math.max(0, Math.min(255, ((a / 64) - 0.5) * 3.2 * 255 + 128));
  }
  const t = new THREE.Data3DTexture(data, N, N, N);
  t.format = THREE.RedFormat; t.type = THREE.UnsignedByteType;
  t.minFilter = t.magFilter = THREE.LinearFilter; t.wrapS = t.wrapT = t.wrapR = THREE.RepeatWrapping;
  t.unpackAlignment = 1; t.needsUpdate = true;
  return t;
}
U.uNoise.value = makeNoise3D();

/* =====================================================================
   GLSL
   ===================================================================== */
const GLSL_COMMON = /* glsl */`
#define PI 3.14159265
uniform vec3 uKeyDir, uKeyCol, uFillDir, uFillCol, uRimDir, uRimCol, uRim2Dir, uRim2Col, uSky, uGround, uCatchDir;
uniform float uTime;
uniform vec3 uPC[8];
uniform vec3 uPR[8];
uniform highp sampler3D uNoise;
float sat(float x){ return clamp(x, 0.0, 1.0); }
vec4 hash42(vec2 p){ vec4 p4 = fract(vec4(p.xyxy) * vec4(.1031, .1030, .0973, .1099)); p4 += dot(p4, p4.wzxy + 33.33); return fract((p4.xxyz + p4.yzzw) * p4.zywx); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float noise3(vec3 p){ return texture(uNoise, p).r; }
vec3 hemi(vec3 n){ return mix(uGround, uSky, n.y * 0.5 + 0.5); }
float wrapD(vec3 n, vec3 l, float w){ return max(0.0, (dot(n, l) + w) / (1.0 + w)); }
// soft shadow of a directional light by world ellipsoid proxies; mask bit i = ignore proxy i
float proxyVis(vec3 p, vec3 Ld, int mask, float soft){
  float v = 1.0;
  for (int i = 0; i < 8; i++){
    if (((mask >> i) & 1) == 1) continue;
    vec3 o = (p - uPC[i]) / uPR[i];
    vec3 d = Ld / uPR[i];
    float t = -dot(o, d) / dot(d, d);
    if (t <= 0.0) continue;
    float m = length(o + d * t);
    float w = soft * t + 0.06;
    v *= mix(0.12, 1.0, smoothstep(1.0 - w, 1.0 + w * 0.6, m));
  }
  return v;
}
// analytic studio environment (for glossy eyes and yarn sheen)
float softbox(vec3 r, vec3 dir, vec2 size, float round){
  vec3 up = abs(dir.y) < 0.95 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  vec3 bx = normalize(cross(up, dir)); vec3 by = cross(dir, bx);
  float z = dot(r, dir); if (z <= 0.05) return 0.0;
  vec2 p = vec2(dot(r, bx), dot(r, by)) / z;
  vec2 q = abs(p) - size + round;
  float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - round;
  return 1.0 - smoothstep(-0.015, 0.02, d);
}
vec3 envStudio(vec3 r, float gain){
  vec3 c = mix(uGround * 0.7, uSky * 1.1, smoothstep(-0.35, 0.7, r.y));
  c += uKeyCol * 1.6 * gain * softbox(r, uKeyDir, vec2(0.42, 0.30), 0.12);
  c += vec3(1.0) * 2.6 * gain * softbox(r, uCatchDir, vec2(0.16, 0.11), 0.06);
  c += vec3(1.0) * 1.2 * gain * softbox(r, normalize(uCatchDir + vec3(0.55, 0.05, 0.0)), vec2(0.035, 0.035), 0.03);
  c += uRimCol * 0.9 * gain * softbox(r, uRimDir, vec2(0.12, 0.45), 0.05);
  c += uRim2Col * 0.6 * gain * softbox(r, uRim2Dir, vec2(0.12, 0.45), 0.05);
  return c;
}
`;

/* ---------------- Fur: shared vertex (base layer and shells) ---------------- */
const FUR_VERT = /* glsl */`
${GLSL_COMMON}
attribute vec3 aComb;
attribute vec4 aFur;          // x length scale, y light-patch region, z baked AO, w shadow-proxy mask
#ifdef LIDS
attribute float aLid;
uniform mat4 uLidMat[4];
#endif
uniform float uShells, uFurLen, uCombAmt, uGravity, uWind;
varying vec2 vUv;
varying float vH;
varying vec3 vRest;
varying float vRegion;
varying vec3 vDiff;
varying vec3 vSpec;
varying vec3 vBack;
varying float vSil;
varying float vAO;
varying vec3 vWN;
varying vec3 vWP;
varying float vLen;
void main(){
  vec3 p = position; vec3 n = normal; vec3 cm = aComb;
#ifdef LIDS
  mat4 LM = uLidMat[int(aLid + 0.5)];
  p = (LM * vec4(p, 1.0)).xyz; n = mat3(LM) * n; cm = mat3(LM) * cm;
#endif
  float h = 0.0;
#ifdef SHELL
  h = (float(gl_InstanceID) + 1.0) / uShells;
#endif
  float len = uFurLen * aFur.x;
  vec3 wN = normalize(mat3(modelMatrix) * n);
  vec3 wC = mat3(modelMatrix) * cm;
  vec3 wP0 = (modelMatrix * vec4(p, 1.0)).xyz;
  // lean: comb direction + gravity + slow breeze, mostly tangential
  float breeze = sin(uTime * 1.3 + wP0.x * 3.0 + wP0.y * 2.0) * 0.5 + sin(uTime * 2.1 + wP0.z * 4.0) * 0.3;
  vec3 lean = wC * uCombAmt + vec3(0.0, -1.0, 0.0) * uGravity + vec3(0.6, 0.1, 0.3) * breeze * uWind;
  lean -= wN * dot(lean, wN) * 0.8;
  vec3 wP = wP0 + wN * len * h + lean * len * h * h;
  vec3 T = normalize(wN * 0.8 + normalize(wC + 1e-4) * 0.6 + lean * 2.0 * h);
  vec3 V = normalize(cameraPosition - wP);
  float ndv = dot(wN, V);
  float sil = 1.0 - abs(ndv);
  int mask = int(aFur.w + 0.5);
  float ao = aFur.z;
  // direct light, soft analytic shadows
  float sKey = proxyVis(wP, uKeyDir, mask, 0.22);
  float sRim = proxyVis(wP, uRimDir, mask, 0.3);
  float sRim2 = proxyVis(wP, uRim2Dir, mask, 0.3);
  vec3 diff = hemi(wN) * ao * 1.05;
  vec3 keyD = uKeyCol * pow(wrapD(wN, uKeyDir, 0.3), 1.35) * sKey * mix(0.7, 1.0, ao);
  diff += keyD;
  diff += uFillCol * wrapD(wN, uFillDir, 0.6) * mix(0.55, 1.0, ao);
  diff += uRimCol * pow(wrapD(wN, uRimDir, 0.25), 2.0) * sRim * 0.8;
  diff += uRim2Col * pow(wrapD(wN, uRim2Dir, 0.25), 2.0) * sRim2 * 0.8;
  // Kajiya-Kay fibre highlight (weak and broad on felt)
  vec3 Hk = normalize(uKeyDir + V); float th = dot(T, Hk);
  vec3 spec = uKeyCol * pow(max(0.0, 1.0 - th * th), 18.0) * sKey * 0.05 * ao;
  vec3 Hr = normalize(uRimDir + V); float tr = dot(T, Hr);
  spec += uRimCol * pow(max(0.0, 1.0 - tr * tr), 10.0) * sRim * 0.06 * wrapD(wN, uRimDir, 0.3);
  // light scattered through thin backlit fibres at the silhouette
  float bk = pow(sat(dot(-V, uRimDir)), 2.0) * sRim * wrapD(wN, uRimDir, 0.5) + pow(sat(dot(-V, uRim2Dir)), 2.0) * sRim2 * 0.7 * wrapD(wN, uRim2Dir, 0.5) + pow(sat(dot(-V, uKeyDir)), 2.0) * sKey * 0.6;
  vec3 back = vec3(bk) * pow(sil, 2.2) * 1.6 + uKeyCol * pow(sil, 3.0) * wrapD(wN, uKeyDir, 0.8) * sKey * 0.35;
  vUv = uv; vH = h; vRest = p; vRegion = aFur.y; vDiff = diff; vSpec = spec; vBack = back; vSil = sil; vAO = ao;
  vWN = wN; vWP = wP; vLen = aFur.x;
  gl_Position = projectionMatrix * viewMatrix * vec4(wP, 1.0);
}
`;

/* ---------------- Fur: shell fragment ---------------- */
const FUR_SHELL_FRAG = /* glsl */`
${GLSL_COMMON}
uniform vec3 uColA, uColB;        // body colour, light patch colour (linear)
uniform float uRows, uRows2, uRootDark, uShells, uNoiseScale, uDensity2, uCurl, uClumpScale;
varying vec2 vUv; varying float vH; varying vec3 vRest; varying float vRegion;
varying vec3 vDiff; varying vec3 vSpec; varying vec3 vBack; varying float vSil; varying float vAO; varying float vLen;

// one layer of strands laid out in latitude bands (cells stay near-square from pole to pole)
// returns coverage, writes strand random + normalised height along the strand
float strands(vec2 uv, float rows, float h, float lenMul, float rRoot, float rTip, float density, float seed, float clump, vec2 shift, out vec4 rnd, out float t){
  float vr = uv.y * rows + shift.y;
  float row = floor(vr);
  float th = (row + 0.5) / rows * PI;
  float around = max(3.0, floor(2.0 * rows * sin(th) + 0.5));
  float ur = uv.x * around + shift.x;
  vec2 id = vec2(floor(ur), row);
  vec2 f = vec2(fract(ur), fract(vr));
  rnd = hash42(id + seed);
  float aaU = fwidth(uv.x) * around, aaV = fwidth(uv.y) * rows;
  float aa = max(max(aaU, aaV), 1e-4);
  float sl = mix(0.45, 1.0, rnd.z) * lenMul * mix(0.8, 1.12, clump);   // strand length (0..1 of shell stack)
  t = h / max(sl, 1e-3);
  float alive = (rnd.w < density && t <= 1.0) ? 1.0 : 0.0;
  vec2 c = 0.5 + (rnd.xy - 0.5) * 0.26;
  c += (rnd.yx - 0.5) * 0.5 * t;                       // per-strand lean (tips smear into streaks, not dots)
  float ph = rnd.z * 6.2831 + t * mix(7.0, 15.0, rnd.w); // wool crimp: each fibre winds a small helix
  c += vec2(cos(ph), sin(ph)) * 0.13 * smoothstep(0.0, 0.3, t);
  float rad = mix(rRoot, rTip, pow(sat(t), 0.8));
  float d = length(f - c);
  float cov = (1.0 - smoothstep(rad - aa * 0.7, rad + aa * 0.7, d)) * alive;
  // below ~1.5px per cell the pattern cannot be resolved: fade to its average coverage
  float px = 1.0 / aa;
  float mean = density * PI * rad * rad * step(t, 1.0) * sat(1.3 - h / max(lenMul, 1e-3) * 0.5);
  return mix(mean, cov, smoothstep(0.9, 2.2, px));
}

void main(){
  float h = vH;
  // felt clumps: fibres in one clump bend the same way (matted, crimped look)
  vec3 cp = vRest * uClumpScale;
  float clump = noise3(cp);
  vec2 cv = vec2(noise3(cp + vec3(0.31, 0.0, 0.0)), noise3(cp + vec3(0.0, 0.57, 0.13))) - 0.5;
  float mott = noise3(vRest * uNoiseScale);
  float lenMul = mix(0.72, 1.12, clump);
  vec4 r1, r2; float t1, t2;
  vec2 sh = cv * uCurl * h * h;
  float c1 = strands(vUv, uRows, h, 0.8 * lenMul, 0.36, 0.12, 0.95, 0.0, clump, sh, r1, t1);             // dense undercoat
  float c2 = strands(vUv, uRows2, h, 1.0 * lenMul, 0.24, 0.06, uDensity2, 17.0, clump, sh * 0.6, r2, t2); // longer guard fibres
  float cov = 1.0 - (1.0 - c1) * (1.0 - c2);
  if (cov < 0.004) discard;
  float w2 = c2 / max(c1 + c2, 1e-4);
  vec4 rnd = mix(r1, r2, w2);
  float t = mix(t1, t2, w2);
  // fibre-level dithered border between body and light patch
  float isPatch = step(rnd.y, smoothstep(0.0, 1.0, vRegion));
  vec3 alb = mix(uColA, uColB, isPatch);
  alb *= 0.9 + 0.2 * rnd.x;                          // fibre-to-fibre value variation
  alb *= 0.86 + 0.14 * mott + 0.12 * clump;          // felted mottling (matted clumps read darker)
  alb = mix(alb, alb * vec3(1.06, 1.03, 0.97), step(0.93, rnd.z) * 0.6); // a few warmer stray fibres
  float selfSh = mix(uRootDark, 1.0, pow(h, 0.75)) * mix(0.9, 1.03, clump);  // self shadowing towards the root and between clumps
  // multiple scattering inside the wool: shadowed fibres get richer, not greyer
  float lum = dot(vDiff, vec3(0.3, 0.59, 0.11));
  float al = dot(alb, vec3(0.2126, 0.7152, 0.0722));
  vec3 rich = max(vec3(0.0), mix(vec3(al), alb, mix(1.18, 1.0, smoothstep(0.3, 1.2, lum))));
  vec3 col = rich * vDiff * selfSh;
  // fine fibre tips catch light and look a touch paler (the misty edge of real wool)
  col += mix(alb, vec3(al), 0.5) * vDiff * 0.1 * t * t;
  col += vSpec * (0.4 + 1.2 * rnd.z) * t;
  col += mix(alb, vec3(al), 0.2) * vBack * (0.3 + 0.7 * t) * 1.2;
  float alpha = cov * (1.0 - 0.8 * smoothstep(0.45, 1.0, t));
  alpha *= mix(1.0, 0.55, smoothstep(0.75, 1.0, vSil));   // soften stacked-slice look at grazing angles
  gl_FragColor = vec4(col, alpha);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}
`;

/* ---------------- Fur: base layer (velvet) ---------------- */
const FUR_BASE_FRAG = /* glsl */`
${GLSL_COMMON}
uniform vec3 uColA, uColB;
uniform float uRootDark, uNoiseScale;
varying vec2 vUv; varying float vH; varying vec3 vRest; varying float vRegion;
varying vec3 vDiff; varying vec3 vSpec; varying vec3 vBack; varying float vSil; varying float vAO; varying vec3 vWN; varying vec3 vWP;
void main(){
  float clump = noise3(vRest * uNoiseScale);
  vec3 alb = mix(uColA, uColB, smoothstep(0.1, 0.9, vRegion)) * (0.92 + 0.14 * clump);
  vec3 V = normalize(cameraPosition - vWP);
  float ndv = sat(dot(normalize(vWN), V));
  // velvet / sheen: fibres standing on the surface light up at grazing view
  float sheen = pow(1.0 - ndv, 3.0) * 0.6;
  vec3 col = alb * vDiff * uRootDark * 1.15 + alb * vDiff * sheen * 0.5;
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}
`;

/* ---------------- Strands: silhouette fringe + flyaways (camera-facing ribbons) ---------------- */
const STRAND_VERT = /* glsl */`
${GLSL_COMMON}
attribute float aT;         // 0 root .. 1 tip
attribute float aSide;      // -1 / 1
attribute vec3 iRoot;
attribute vec3 iN;
attribute vec3 iDir;        // random tangent
attribute vec4 iP;          // x length, y curl curvature, z width, w type (0 halo, 1 flyaway)
attribute vec2 iR;          // x region, y random
uniform float uPx;
uniform float uGravity;
uniform vec3 uColA, uColB;
varying float vA; varying vec3 vCol; varying float vEdge; varying float vT;

const KNIT_FUNCS = /* glsl */`
// one yarn leg: an elongated dome, tilted; 'top' tucks under the next row
float leg(vec2 p, vec2 c, float ang, vec2 ax, out float along){
  vec2 d = p - c;
  float s = sin(ang), co = cos(ang);
  vec2 r = vec2(co * d.x + s * d.y, -s * d.x + co * d.y);
  vec2 q = r / ax;
  along = q.y;
  float e = dot(q, q);
  float dome = sqrt(max(0.0, 1.0 - e));
  return dome * mix(1.0, 0.72, smoothstep(-0.1, 1.0, q.y));
}
// stockinette / 1x1 rib height field in stitch space (x: columns, y: rows)
float knitH(vec2 st, float rib, out float ply, out vec2 cellId){
  vec2 cell = floor(st);
  cellId = cell;
  float h = 0.0; ply = 0.0;
  for (int k = -1; k <= 1; k++){
    vec2 id = cell + vec2(0.0, float(k));
    vec4 rr = hash42(id * 1.7 + 3.0);
    vec2 f = st - id;
    f.y *= 0.72;                                  // rows are ~0.72 of a column wide
    float jit = (rr.x - 0.5) * 0.04;
    float a1, a2;
    float wv = mix(1.0, 0.72, rib);
    vec2 ax = vec2(0.165 * wv, 0.5) * (0.97 + 0.06 * rr.y);
    float l1 = leg(f, vec2(0.5 - 0.225 * wv + jit, 0.37), 0.5 * mix(1.0, 0.75, rib), ax, a1);
    float l2 = leg(f, vec2(0.5 + 0.225 * wv + jit, 0.37), -0.5 * mix(1.0, 0.75, rib), ax, a2);
    float m = max(l1, l2);
    if (m > h){
      h = m;
      float a = l1 > l2 ? a1 : a2;
      float side = l1 > l2 ? 1.0 : -1.0;
      ply = sin((a * 5.5 + side * f.x * 3.0 + rr.z) * 6.2831);
    }
  }
  if (rib > 0.5){
    // purl valley between rib columns: every second column sinks
    float colOdd = mod(cell.x, 2.0);
    h *= mix(1.0, 0.35, colOdd);
  }
  return h;
}
`;

/* =====================================================================
   Geometry builders
   ===================================================================== */
const TAU = Math.PI * 2;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const gauss2 = (x, y, cx, cy, sx, sy) => Math.exp(-(((x - cx) / sx) ** 2) - (((y - cy) / sy) ** 2));

function basisFor(d) {
  const a = Math.abs(d.z) < 0.9 ? new V3(0, 0, 1) : new V3(1, 0, 0);
  const t1 = new V3().crossVectors(a, d).normalize();
  const t2 = new V3().crossVectors(d, t1);
  return [t1, t2];
}

/**
 * Deformed-sphere fur part. The canonical pole is +Z; `pole` (quaternion) rotates it into part space.
 * shape(dir) -> position in part space (star-shaped around the origin).
 * UV = (azimuth / 2pi, inclination / pi) so the latitude-band strand cells stay square.
 */
function spherePart({ segU, segV, thetaMax = Math.PI, pole = new THREE.Quaternion(), shape, comb, fur, matrix }) {
  segU = Math.max(12, Math.round(segU * KNOBS.meshLOD)); segV = Math.max(8, Math.round(segV * KNOBS.meshLOD));
  const nv = (segU + 1) * (segV + 1);
  const P = new Float32Array(nv * 3), N = new Float32Array(nv * 3), UV = new Float32Array(nv * 2), C = new Float32Array(nv * 3), F = new Float32Array(nv * 4);
  const d = new V3(), dd = new V3(), p = new V3(), pa = new V3(), pb = new V3(), pc = new V3(), pd = new V3(), n = new V3();
  const nm = new THREE.Matrix3().getNormalMatrix(matrix);
  let k = 0;
  for (let j = 0; j <= segV; j++) {
    const th = (j / segV) * thetaMax;
    for (let i = 0; i <= segU; i++, k++) {
      const ph = (i / segU) * TAU;
      d.set(Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)).applyQuaternion(pole);
      p.copy(shape(d));
      const [t1, t2] = basisFor(d);
      const e = 2e-3;
      pa.copy(shape(dd.copy(d).addScaledVector(t1, e).normalize()));
      pb.copy(shape(dd.copy(d).addScaledVector(t1, -e).normalize()));
      pc.copy(shape(dd.copy(d).addScaledVector(t2, e).normalize()));
      pd.copy(shape(dd.copy(d).addScaledVector(t2, -e).normalize()));
      n.crossVectors(pa.sub(pb), pc.sub(pd)).normalize();
      if (n.dot(d) < 0) n.negate();
      const c = comb ? comb(d, p, n) : new V3();
      c.addScaledVector(n, -c.dot(n));
      const f = fur ? fur(d, p, n) : [1, 0, 1, 0];
      const wp = p.clone().applyMatrix4(matrix), wn = n.clone().applyMatrix3(nm).normalize(), wc = c.applyMatrix3(nm);
      P.set([wp.x, wp.y, wp.z], k * 3); N.set([wn.x, wn.y, wn.z], k * 3); C.set([wc.x, wc.y, wc.z], k * 3);
      UV.set([i / segU, th / Math.PI], k * 2); F.set(f, k * 4);
    }
  }
  const idx = [];
  for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) {
    const a = j * (segU + 1) + i, b = a + segU + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(P, 3));
  g.setAttribute("normal", new THREE.BufferAttribute(N, 3));
  g.setAttribute("uv", new THREE.BufferAttribute(UV, 2));
  g.setAttribute("aComb", new THREE.BufferAttribute(C, 3));
  g.setAttribute("aFur", new THREE.BufferAttribute(F, 4));
  g.setIndex(idx);

function knitGrid({ segU, segV, fn, outward, cols, rowH, rib, ownerMask }) {
  return gridPart({
    segU, segV, fn, outward,
    extra: (g, pts, su, sv) => {
      const n = pts.length;
      const UV = new Float32Array(n * 2), T = new Float32Array(n * 4), K = new Float32Array(n * 4);
      // arc length along v (per column 0) for row coordinates
      const arc = [0];
      for (let j = 1; j <= sv; j++) {
        let acc = 0; for (let i = 0; i < su; i += Math.max(1, su >> 3)) acc += pts[j * (su + 1) + i].distanceTo(pts[(j - 1) * (su + 1) + i]);
        arc.push(arc[j - 1] + acc / Math.ceil(su / Math.max(1, su >> 3)));
      }
      let k = 0;
      for (let j = 0; j <= sv; j++) for (let i = 0; i <= su; i++, k++) {
        UV.set([(i / su) * cols, arc[j] / rowH], k * 2);
        const a = pts[j * (su + 1) + ((i + 1) % su)], b = pts[j * (su + 1) + ((i - 1 + su) % su)];
        const t = a.clone().sub(b).normalize();
        T.set([t.x, t.y, t.z, rib], k * 4);
        K.set([1, ownerMask, 0, 0], k * 4);
      }
      g.setAttribute("uv", new THREE.BufferAttribute(UV, 2));
      g.setAttribute("aTan", new THREE.BufferAttribute(T, 4));
      g.setAttribute("aK", new THREE.BufferAttribute(K, 4));

function blinkAmount(t) {
  // quick close (70 ms), short hold, slower open (140 ms)
  const d = t - anim.blinkT;
  if (d < 0 || d > 0.32) return 0;
  if (d < 0.07) return d / 0.07;
  if (d < 0.11) return 1;
  return 1 - (d - 0.11) / 0.21;
}
function updateAnim(t) {
  U.uTime.value = t;
  // breathing: 4.2 s cycle, chest swells, head floats
  const br = Math.sin(t * TAU / 4.2);
  bodyG.scale.set(1 + 0.012 * br, 1 + 0.018 * br, 1 + 0.014 * br);
  headG.position.set(HEAD_POS.x, HEAD_POS.y + 0.012 * br + 0.004 * Math.sin(t * 0.9), HEAD_POS.z);
  headG.rotation.set(0.02 * Math.sin(t * 0.7), 0.035 * Math.sin(t * 0.43), 0.02 * Math.sin(t * 0.55 + 1));
  // blink
  if (anim.frozen === null && t > anim.nextBlink) { anim.blinkT = t; anim.nextBlink = t + 2.5 + Math.random() * 3.5; }
  const bl = blinkAmount(t);
  // gaze drift
  const gx = anim.gaze.x + 0.05 * Math.sin(t * 0.31), gy = anim.gaze.y + 0.03 * Math.sin(t * 0.23 + 2);
  eyes.forEach((e, k) => {
    const s = e.s;
    tmpQ.setFromEuler(tmpE.set(-gy, gx, 0));
    e.ball.quaternion.copy(tmpQ);
    const gm = new THREE.Matrix3().setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(tmpQ));
    e.mat.uniforms.uGaze.value.copy(gm);
    // upper lid: rest heavy angle + blink; follows vertical gaze a little
    const up = anim.lidHeavy + bl * (0.9 - anim.lidHeavy) - gy * 0.4;
    const tilt = anim.lidTilt * s;   // inner corner lower
    const mUp = new THREE.Matrix4().compose(e.center, e.sock.quaternion.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(up, 0, tilt))), new V3(1, 1, 1));
    const lo = 0.02 - bl * 0.1;
    const mLo = new THREE.Matrix4().compose(e.center, e.sock.quaternion.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(lo, 0, -tilt * 0.3))), new V3(1, 1, 1));
    M.lid.u.uLidMat.value[k * 2].copy(mUp);
    M.lid.u.uLidMat.value[k * 2 + 1].copy(mLo);
    // lid planes in socket space for the eye shader
    const upPole = new V3(0, 1, 0).applyEuler(new THREE.Euler(up, 0, tilt));
    const loPole = new V3(0, -1, 0).applyEuler(new THREE.Euler(lo, 0, -tilt * 0.3));
    e.mat.uniforms.uLidUp.value.set(upPole.x, upPole.y, upPole.z, Math.cos(LID.upEdge) - 0.02);
    e.mat.uniforms.uLidLo.value.set(loPole.x, loPole.y, loPole.z, Math.cos(LID.loEdge));
  });
  // shadow proxies (world)
  character.updateMatrixWorld(true);
  const hp = headG.localToWorld(new V3(0, 0, 0));
  const set = (i, c, r) => { U.uPC.value[i].copy(c); U.uPR.value[i].copy(r); };
  set(0, hp, HEAD_R.clone().multiplyScalar(1.02));
  set(1, bodyG.localToWorld(new V3(0, 0.6, 0)), new V3(0.54, 0.47, 0.47));
  ARM.forEach((a, k) => set(2 + k, bodyG.localToWorld(a.curve.getPoint(0.6)), new V3(0.15, 0.24, 0.15)));
  EAR.forEach((e, k) => set(4 + k, headG.localToWorld(e.pos.clone().add(new V3(0, 0.05, 0))), new V3(0.17, 0.22, 0.12)));
  set(6, bodyG.localToWorld(new V3(0, 0.17, 0.0)), new V3(0.47, 0.17, 0.41));
  set(7, bodyG.localToWorld(new V3(0, 1.05, 0)), new V3(0.36, 0.08, 0.33));
}

/* =====================================================================
   Views
   ===================================================================== */
const VIEWS = {
  front:        { pos: [0, 1.35, 7.4], target: [0, 1.18, 0], fov: 26 },
  threequarter: { pos: [4.3, 1.9, 5.9], target: [0.02, 1.2, 0], fov: 26 },
  close:        { pos: [0.55, 1.78, 3.35], target: [0, 1.62, 0.1], fov: 26 },
  fur:          { pos: [-0.9, 1.72, 1.25], target: [-0.66, 1.55, 0.18], fov: 24 },
  eyes:         { pos: [0.18, 1.7, 1.55], target: [0.05, 1.66, 0.45], fov: 24 },
  knit:         { pos: [0.3, 0.75, 1.9], target: [0.05, 0.72, 0.4], fov: 26 },
  bust:         { pos: [0, 1.62, 4.6], target: [0, 1.5, 0], fov: 26 },
  side:         { pos: [7.2, 1.5, 0.4], target: [0, 1.2, 0], fov: 26 },
  back:         { pos: [-2.5, 1.6, -6.6], target: [0, 1.2, 0], fov: 26 },
};
let viewName = qp("angle", qp("view", THUMB || LIST ? "bust" : "front"));
function setView(name) {
  const v = VIEWS[name]; if (!v) return;
  viewName = name;
  camera.position.set(...v.pos); camera.fov = v.fov; camera.lookAt(new V3(...v.target)); camera.updateProjectionMatrix();
  // centre of the backdrop gradient follows the head on screen
  const hp = new V3(0, 1.55, 0).project(camera);
  bgMat.uniforms.uCenter.value.set(hp.x * 0.5 + 0.5, hp.y * 0.5 + 0.5);
  requestRender();
}

/* =====================================================================
   Loop
   ===================================================================== */
let needsRender = true;
function requestRender() { needsRender = true; }
function resize() {
  const w = host.clientWidth || window.innerWidth, h = host.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  bgMat.uniforms.uAspect.value = w / h;
  requestRender();
}
window.addEventListener("resize", () => { resize(); setView(viewName); });
const clock0 = performance.now();
let frames = 0, fpsT = performance.now(), fps = 0;
function frame() {
  const t = anim.frozen !== null ? anim.frozen : (performance.now() - clock0) / 1000;
  updateAnim(t);
  const h = renderer.getSize(new THREE.Vector2()).y;
  U.uPx.value = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / (h * renderer.getPixelRatio());
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - fpsT > 1000) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; hud(); }
}
function hud() {
  const info = renderer.info.render;
  document.getElementById("hud").textContent = `shell fur lookdev  ${currentColor}  ${viewName}\nshells ${S}  strands ${(headStrandGeom.instanceCount + bodyStrandGeom.instanceCount + knitStrandGeom.instanceCount)}  pr ${KNOBS.pixelRatio}\ncalls ${info.calls}  tris ${(info.triangles / 1e6).toFixed(2)}M  fps ${fps.toFixed(0)}  AO bake ${bakeMs.toFixed(0)} ms`;
}
function loop() {
  if (anim.frozen === null || needsRender) { frame(); needsRender = false; }
  requestAnimationFrame(loop);
}

/* =====================================================================
   Public API
   ===================================================================== */
window.setView = setView;
window.setColor = setColor;
window.freeze = (t) => { anim.frozen = t === undefined || t === null ? null : +t; requestRender(); };
window.blink = () => { anim.blinkT = anim.frozen ?? (performance.now() - clock0) / 1000; };
window.setLid = (heavy) => { anim.lidHeavy = heavy; requestRender(); };
window.setGaze = (x, y) => { anim.gaze.set(x, y); requestRender(); };
window.setQuality = ({ shells, pixelRatio } = {}) => {
  if (shells) {
    const ratio = shells / S;
    for (const [m, mesh] of [[M.head, headMesh], [M.ear, earMesh], [M.lid, lidMesh], [M.nose, noseMesh], [M.body, bodyFurMesh]]) {
      const n = Math.max(2, Math.round(m.u.uShells.value * ratio)); m.u.uShells.value = n; mesh.ig.instanceCount = n;
    }
  }
  if (pixelRatio) { renderer.setPixelRatio(pixelRatio); resize(); }
  requestRender();
};
window.lookdev = { renderer, scene, camera, KNOBS, frame };

resize();
setColor(currentColor);
setView(viewName);
if (Q.has("t")) anim.frozen = +Q.get("t");
if (Q.has("blink")) { anim.frozen = anim.frozen ?? 1; anim.blinkT = anim.frozen - +Q.get("blink"); }
if (Q.has("lid")) anim.lidHeavy = +Q.get("lid");

if (LIST) {
  // 40 px list rows: render each palette colour through the same renderer and copy the pixels
  const list = document.getElementById("list");
  anim.frozen = 1.0;
  renderer.setSize(80, 80, false); renderer.setPixelRatio(1); camera.aspect = 1; camera.updateProjectionMatrix(); bgMat.uniforms.uAspect.value = 1;
  setView("bust");
  for (const id of Object.keys(PALETTE)) {
    setColor(id); frame();
    const row = document.createElement("div"); row.className = "row";
    const cv = document.createElement("canvas"); cv.width = 80; cv.height = 80;
    cv.getContext("2d").drawImage(renderer.domElement, 0, 0, 80, 80);
    const label = document.createElement("span"); label.textContent = id[0].toUpperCase() + id.slice(1) + " agent";
    row.append(cv, label); list.append(row);
  }
} else {
  requestAnimationFrame(loop);
}
</script>
</body>
