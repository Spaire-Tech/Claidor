<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caisra</title>
    <style>
      /*
        The ground, and nothing else.

        This was 185 lines recreating the engine splash before React
        mounted — logo, progress bar, tip carousel. It is gone: the
        founder asked for nothing on screen until the app is ready, and
        the app's own ground is what "nothing" looks like.

        `#fbfbfc` is the design's paper (`design/tokens.ts`), so there is
        no flash between this and the first frame React draws.
      */
      html, body { margin: 0; height: 100%; background: #fbfbfc; }
      #root { height: 100%; }
    </style>
    <script>
      // Kept: it only settles the theme class before paint so the old
      // shell does not flash. It draws nothing.
      (function () {
        try {
          var appearance = localStorage.getItem('lobster-theme-appearance');
          if (appearance !== 'dark' && appearance !== 'light') {
            appearance = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(appearance);
        } catch (e) {
          console.error('Error applying theme early:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Nothing here on purpose. The founder, 14 September: "nothing
        until its ready for now."

        This used to be a static replica of the engine splash — the
        LobsterAI logo, a progress bar and a rotating tip carousel,
        drawn before React had even mounted. It was the first thing the
        app showed, it is nowhere in the design, and it advertised
        upstream's product to our person.

        The ground colour matches the app so there is no flash between
        this and the first frame React draws.
      -->
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
