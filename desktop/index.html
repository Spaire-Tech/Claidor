<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maties</title>
    <style>
      /* Pre-React splash: a static replica of EngineStartupOverlay so the whole
         startup (window shown -> renderer init -> engine starting) is one
         continuous screen. Replaced automatically when React mounts into #root.
         Keep layout/metrics in sync with EngineStartupOverlay.tsx: the sphere
         breathing at 48px and « Starting up » with the shimmer
         (docs/maties/design.md, section 6). The fonts ship with the app. */
      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/instrument-sans.woff2) format('woff2');
      }
      .splash,
      .splash * {
        box-sizing: border-box;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: -0.008em;
      }
      html.dark .splash {
        background: #141518;
      }
      .splash-wash {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 120% at 100% 100%, #e2e4e9 0%, rgba(226, 228, 233, 0) 60%);
        pointer-events: none;
      }
      html.dark .splash-wash {
        display: none;
      }
      .splash-content {
        position: relative;
        display: flex;
        width: 420px;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
        text-align: center;
      }
      /* The sphere, exactly as Sphere.tsx draws it at 48px. */
      .splash-breathe {
        display: inline-flex;
        animation: splash-breathe 3.2s ease-in-out infinite;
      }
      .splash-sphere {
        position: relative;
        display: inline-block;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow:
          0 1px 2px rgba(24, 74, 68, 0.1),
          0 10px 22px rgba(24, 74, 68, 0.18),
          inset 0 -7px 12px rgba(14, 58, 54, 0.22),
          inset 0 5px 10px rgba(255, 255, 255, 0.6),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.5);
      }
      .splash-sphere > span {
        position: absolute;
        border-radius: 50%;
      }
      .splash-sphere-a {
        inset: -40%;
        background:
          radial-gradient(44% 46% at 30% 24%, #f2f6d2 0%, rgba(242, 246, 210, 0) 60%),
          radial-gradient(50% 52% at 74% 20%, #7fdcc6 0%, rgba(127, 220, 198, 0) 66%),
          radial-gradient(54% 56% at 22% 76%, #a9de5c 0%, rgba(169, 222, 92, 0) 68%),
          linear-gradient(160deg, #d8f0b4 0%, #6fcbb8 55%, #3aa0c4 100%);
        filter: blur(5px);
        animation: splash-sphere-a 7s linear infinite;
      }
      .splash-sphere-b {
        inset: -34%;
        opacity: 0.85;
        background:
          radial-gradient(40% 42% at 72% 74%, #2aa6c6 0%, rgba(42, 166, 198, 0) 64%),
          radial-gradient(26% 26% at 56% 56%, #f2a45e 0%, rgba(242, 164, 94, 0) 58%),
          radial-gradient(34% 36% at 20% 40%, #cfeeb0 0%, rgba(207, 238, 176, 0) 62%);
        filter: blur(7px);
        animation: splash-sphere-b 11s linear infinite;
      }
      .splash-sphere-c {
        inset: -20%;
        background:
          radial-gradient(32% 34% at 50% 50%, #f6b26b 0%, rgba(246, 178, 107, 0) 62%),
          radial-gradient(30% 32% at 24% 62%, #8ee06a 0%, rgba(142, 224, 106, 0) 64%);
        filter: blur(6px);
        animation: splash-sphere-c 9s ease-in-out infinite;
      }
      .splash-sphere-glint {
        left: 16%;
        top: 12%;
        width: 34%;
        height: 24%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0));
        filter: blur(1.5px);
        animation: splash-sphere-glint 5.5s ease-in-out infinite;
      }
      .splash-sphere-base {
        left: -10%;
        bottom: -14%;
        width: 70%;
        height: 44%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
        filter: blur(3px);
      }
      .splash-title {
        margin: 24px 0 0;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: -0.006em;
        background: linear-gradient(100deg, #c9ccd2 20%, #6b7280 42%, #c9ccd2 64%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: splash-shimmer 1.8s linear infinite;
      }
      .splash-subtitle {
        margin: 8px 0 0;
        min-height: 18px;
        font-size: 12.5px;
        line-height: 1.45;
        color: #8f96a0;
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes splash-shimmer {
        0% { background-position: 120% 0; }
        100% { background-position: -40% 0; }
      }
      @keyframes splash-sphere-a {
        0% { transform: rotate(0deg) translate(9%, -6%) scale(1.2); }
        33% { transform: rotate(120deg) translate(-7%, 8%) scale(1.4); }
        66% { transform: rotate(240deg) translate(6%, 9%) scale(1.15); }
        100% { transform: rotate(360deg) translate(9%, -6%) scale(1.2); }
      }
      @keyframes splash-sphere-b {
        0% { transform: rotate(0deg) translate(-8%, 7%) scale(1.35); }
        50% { transform: rotate(-180deg) translate(10%, -8%) scale(1.1); }
        100% { transform: rotate(-360deg) translate(-8%, 7%) scale(1.35); }
      }
      @keyframes splash-sphere-c {
        0% { transform: translate(-14%, 10%) scale(1); opacity: 0.55; }
        50% { transform: translate(12%, -12%) scale(1.3); opacity: 0.9; }
        100% { transform: translate(-14%, 10%) scale(1); opacity: 0.55; }
      }
      @keyframes splash-sphere-glint {
        0%, 100% { opacity: 0.7; transform: translate(0, 0) scale(1); }
        50% { opacity: 1; transform: translate(9%, 6%) scale(1.14); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-breathe,
        .splash-sphere > span {
          animation: none;
        }
        .splash-title {
          animation: none;
          background: none;
          color: #6b7280;
          -webkit-text-fill-color: initial;
        }
      }
    </style>
    <script>
      // Apply the theme before the page paints, to avoid a flash.
      // 'lobster-theme-appearance' is written by theme-manager.ts every time a theme is applied.
      (function () {
        try {
          var appearance = localStorage.getItem('lobster-theme-appearance');
          if (appearance !== 'dark' && appearance !== 'light') {
            appearance = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(appearance);
          document.documentElement.style.backgroundColor = appearance === 'dark' ? '#141518' : '#ffffff';
        } catch (e) {
          console.error('Error applying theme early:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <div class="splash-wash"></div>
        <div class="splash-content">
          <span class="splash-breathe" aria-hidden="true">
            <span class="splash-sphere">
              <span class="splash-sphere-a"></span>
              <span class="splash-sphere-b"></span>
              <span class="splash-sphere-c"></span>
              <span class="splash-sphere-glint"></span>
              <span class="splash-sphere-base"></span>
            </span>
          </span>
          <!-- Keep the texts in sync with matiesStartingUp in src/renderer/services/i18n.ts. -->
          <p class="splash-title">Starting up</p>
          <p class="splash-subtitle"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
