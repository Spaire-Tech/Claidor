<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The call's own policy (30 September 2026): exactly what the ElevenLabs
         SDK needs over WebRTC (its API and its LiveKit server), microphone and
         playback streams, and the SDK's audio worklets, which it loads from
         blob: URLs. Nothing else leaves the page. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob: mediastream:; connect-src 'self' https://api.elevenlabs.io wss://api.elevenlabs.io https://*.elevenlabs.io wss://*.elevenlabs.io https://livekit.rtc.elevenlabs.io wss://livekit.rtc.elevenlabs.io; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simeon call</title>
    <link rel="stylesheet" href="./banner.css" />
    <script defer src="./banner.js"></script>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <symbol id="i-mic" viewBox="0 0 24 24"><path fill="currentColor" d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V5.5a3.5 3.5 0 1 0-7 0V11a3.5 3.5 0 0 0 3.5 3.5z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18.5 11a6.5 6.5 0 0 1-13 0M12 17.5V21"/></symbol>
      <symbol id="i-micoff" viewBox="0 0 24 24"><path fill="currentColor" d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V5.5a3.5 3.5 0 1 0-7 0V11a3.5 3.5 0 0 0 3.5 3.5z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18.5 11a6.5 6.5 0 0 1-13 0M12 17.5V21M4 3l16 18"/></symbol>
      <symbol id="i-end" viewBox="0 0 24 24"><path fill="currentColor" d="M12 9.2c-2.1 0-4 .4-5.6 1.1l-.1 2.3c0 .5-.3.9-.7 1.1-.9.4-1.8 1-2.6 1.6-.4.3-1 .3-1.4-.1L.4 14a1.1 1.1 0 0 1 0-1.6C3.4 9.6 7.5 8 12 8s8.6 1.6 11.6 4.4c.5.4.5 1.1 0 1.6l-1.2 1.2c-.4.4-1 .4-1.4.1-.8-.6-1.7-1.2-2.6-1.6-.4-.2-.7-.6-.7-1.1l-.1-2.3A14 14 0 0 0 12 9.2z"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M7.2 3.5c.5 0 .9.3 1.1.7l1.4 3.3c.2.5.1 1-.3 1.3l-1.7 1.4a12 12 0 0 0 6.1 6.1l1.4-1.7c.3-.4.9-.5 1.3-.3l3.3 1.4c.5.2.7.6.7 1.1v2.7c0 .7-.5 1.2-1.2 1.2C10.6 20.7 3.3 13.4 3.3 4.7c0-.7.5-1.2 1.2-1.2h2.7z"/></symbol>
      <symbol id="i-talk" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 7h14M5 12h14M5 17h9"/></symbol>
      <symbol id="i-bubble" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4c5 0 9 3.2 9 7.3s-4 7.3-9 7.3c-.9 0-1.8-.1-2.6-.3L5 20.2l1-3.4C4.2 15.5 3 13.5 3 11.3 3 7.2 7 4 12 4z"/></symbol>
    </defs></svg>
    <div class="banner" data-state="ringing" role="region" aria-label="Call">
      <div class="top">
        <div class="av" aria-hidden="true"></div>
        <div class="id"><div class="nm"></div><div class="st" aria-live="polite">Calling…</div></div>
        <button class="quick" type="button" aria-label="End call"><svg><use href="#i-end"/></svg></button>
      </div>
      <div class="wave" aria-hidden="true"></div>
      <!-- What you both say, as it is said (2 October 2026): opened from Transcript. -->
      <div class="live" role="log" aria-label="Transcript" aria-live="polite"><p class="empty">What you both say shows up here.</p></div>
      <div class="seg">
        <button class="mute" type="button" aria-pressed="false"><svg><use href="#i-mic"/></svg><span>Mute</span></button>
        <button class="talk" type="button" aria-pressed="false"><svg><use href="#i-talk"/></svg><span>Transcript</span></button>
        <button class="end" type="button"><svg><use href="#i-end"/></svg><span>End</span></button>
        <button class="again" type="button"><svg><use href="#i-phone"/></svg><span>Call Again</span></button>
        <button class="chat" type="button"><svg><use href="#i-bubble"/></svg><span>Chat</span></button>
        <button class="close" type="button"><span>Close</span></button>
      </div>
    </div>
  </body>
</html>
