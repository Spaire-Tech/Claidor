# The Windows installer (electron-builder): `npm run package` on Windows, or
# on Linux with Wine. Step 7e adds the icon, the signing and the updates' feed.

appId: com.simeonlabs.simeon
productName: Simeon
copyright: Copyright © 2026 Spaire, Inc.
directories:
  output: out
  buildResources: resources
files:
  - dist/**
  - package.json
# The page: the website's committed build, the one `pnpm test` checks (clients/apps/app).
extraResources:
  - from: ../clients/apps/web/public/app-next
    to: app-next
asar: true
protocols:
  - name: Simeon
    schemes:
      - simeon
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # One click, for this person only: no administrator, in %LOCALAPPDATA%\Programs\Simeon.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Simeon
  artifactName: Simeon-Setup-${version}.${ext}
# Updates (7e): electron-updater reads `latest.yml` here; the server sends it on to the release bucket, as the Mac's appcast.
publish:
  provider: generic
  url: https://api.simeonlabs.com/desktop/download/windows
