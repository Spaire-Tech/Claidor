# Simeon on the Mac, native (SwiftUI): a copy of the Electron Mac app
# (desktop/), screen by screen, with Apple's own controls and the Electron
# window's layout (mac/STEPS.md). XcodeGen makes SimeonMac.xcodeproj from
# this file (`xcodegen generate`, mac/README.md); the project itself is not
# kept in git. The app is this folder's Simeon/, on the shared core
# (../ios/SimeonCore), which has no screens.
name: SimeonMac
options:
  bundleIdPrefix: com.simeonlabs
  deploymentTarget:
    # Apple's design of this year (Liquid Glass).
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The Apple developer team Simeon publishes from: set it here, or in
    # Xcode under Signing & Capabilities, once. Without one the app is
    # signed to run on this Mac only, which is enough to try it.
    DEVELOPMENT_TEAM: ""
packages:
  SimeonCore:
    path: ../ios/SimeonCore
targets:
  Simeon:
    type: application
    platform: macOS
    sources:
      - path: Simeon
        excludes: ["Fonts/**", "Rendering/**"]
      # The sign-in wordmark's face (Suravaram, SIL Open Font License), as
      # the Electron window sets "Simeon" on its sign-in screen.
      - path: Simeon/Fonts
        buildPhase: resources
      # KaTeX and Mermaid (MIT) and their licences: the chat's maths and
      # diagrams, drawn by the same libraries the Electron window uses
      # (Rendering.swift).
      - path: Simeon/Rendering
        buildPhase: resources
    dependencies:
      - package: SimeonCore
        product: SimeonCore
      - package: SimeonCore
        product: SimeonMacCore
    info:
      path: Simeon/Info.plist
      properties:
        CFBundleDisplayName: Simeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Its own scheme while it lives beside the Electron app (which owns
        # `simeon`); the server's confirm page opens `simeon-mac://app/v1/open`.
        CFBundleURLTypes:
          - CFBundleURLName: com.simeonlabs.simeon.mac
            CFBundleURLSchemes: [simeon-mac]
        LSApplicationCategoryType: public.app-category.productivity
        # Dictation (step 2e) and calls ask for the microphone in the Electron app's words (`own-shell.mjs`).
        NSMicrophoneUsageDescription: Simeon uses the microphone to take your dictation and for voice calls with your agents.
        NSHumanReadableCopyright: Copyright © 2026 SimeonLabs, Inc.
        # Loopback and the local network over http, for a build pointed at
        # the stand-in server on this Mac (`SIMEON_API`).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Simeon/Simeon.entitlements
      properties:
        # The hardened runtime asks for the microphone by name (dictation and calls, later steps).
        com.apple.security.device.audio-input: true
    settings:
      base:
        # Beside the Electron app while it grows (`com.simeonlabs.simeon`); it takes that id at the switch (mac/README.md).
        PRODUCT_BUNDLE_IDENTIFIER: com.simeonlabs.simeon.mac
        PRODUCT_NAME: Simeon
        ASSETCATALOG_COMPILER_APPICON_NAME: MacIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
schemes:
  Simeon:
    build:
      targets:
        Simeon: all
    run:
      config: Debug
    archive:
      config: Release
