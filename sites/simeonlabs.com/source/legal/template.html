<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>%TITLE% | SimeonLabs</title>
<meta name="description" content="%DESCRIPTION%">
<link rel="canonical" href="https://simeonlabs.com/%SLUG%">
<meta property="og:type" content="website">
<meta property="og:url" content="https://simeonlabs.com/%SLUG%">
<meta property="og:title" content="%TITLE% | SimeonLabs">
<meta property="og:description" content="%DESCRIPTION%">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
/* The legal pages: the home page's bar and footer (source/page.html) around a plain reading
   column, as plain as the founder's reference legal pages (11 October 2026: "too noisy, do it
   simple"): the two pages' links on the left, the title, the date, the policy's contents in a
   box that folds, then the text. Light only, every colour from the home page's own. Made by
   legal.py. */
:root{
  --page:#fff; --soft:#f5f5f7; --ink:#1d1d1f; --ink2:#6e6e73; --line:#e5e5ea;
  --gutter:max(20px,4.6vw);
  --col:min(1840px,calc(100vw - 2 * var(--gutter))); /* the home page's column */
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:var(--t-lead);line-height:1.6;letter-spacing:-.016em;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p,ul,ol{margin:0}
a{color:inherit}
.wrap{width:var(--col);margin-inline:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;background:#000;color:#fff;font-weight:400;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
.btn:hover{background:#2b2b2d}

/* The bar, as on the home page; the name goes home. */
.bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;height:clamp(52px,3.8vw,76px)}
.bar .wordmark{--wm:clamp(118px,10.8vw,217px);display:block;width:var(--wm);margin-left:calc(var(--wm) * -85 / 1585);background:var(--ink);-webkit-mask:url(/img/wordmark-labs.png) center/contain no-repeat;mask:url(/img/wordmark-labs.png) center/contain no-repeat;aspect-ratio:1585/460}
.bar .btn{height:clamp(28px,1.9vw,38px);padding:0 clamp(12px,.8vw,16px);font-size:var(--t-nav)}

.bar .acts{display:flex;align-items:center;gap:clamp(14px,1.2vw,22px);font-size:var(--t-nav)}
.bar .acts>a:not(.btn){text-decoration:none;color:var(--ink2)}
.bar .acts>a:not(.btn):hover{color:var(--ink)}
@media (max-width:480px){.bar .acts{gap:16px}.bar .acts .btn{display:none}} /* as on Teams and Connectors */

/* The page: the two pages' links on the left, the text in a column at the middle. */
.legal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,720px) minmax(0,1fr);column-gap:48px;padding:clamp(56px,6vw,120px) 0 clamp(80px,8vw,160px)}
.pages{position:sticky;top:clamp(84px,6vw,120px);align-self:start;display:flex;flex-direction:column;gap:8px;font-size:var(--t-body)}
.pages a{color:var(--ink2);text-decoration:none}
.pages a:hover,.pages a[aria-current]{color:var(--ink)}
article{grid-column:2;min-width:0}
h1{max-width:var(--title-max);font-size:var(--t-display);font-weight:var(--w-display);line-height:1.15;letter-spacing:-.025em;text-wrap:pretty}
.updated{margin-top:12px;color:var(--ink2)}

/* The contents, in a box that folds. */
.toc{margin-top:48px;padding:14px 16px 16px;border-radius:8px;background:var(--soft)}
.toc summary{display:flex;justify-content:space-between;align-items:center;list-style:none;cursor:pointer;font-size:var(--t-body);color:var(--ink2)}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"";width:7px;height:7px;margin-right:4px;border:solid var(--ink2);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg)}
.toc[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.toc ol{margin-top:8px;padding:0;list-style:none;font-size:var(--t-body);line-height:1.8}
.toc a{text-decoration:none}
.toc a:hover{text-decoration:underline}

/* The text. */
.doc{margin-top:48px}
.doc a{text-decoration:underline;text-decoration-color:rgba(29,29,31,.35);text-underline-offset:3px}
.doc a:hover{text-decoration-color:var(--ink)}
.doc section{margin-top:56px}
.doc h2{font-size:var(--t-title);font-weight:var(--w-display);line-height:1.3;letter-spacing:-.02em}
.doc h3{margin-top:32px;font-size:var(--t-head);font-weight:var(--w-title)}
.doc p,.doc ul,.doc ol,.doc .table{margin-top:20px}
.doc h2+p,.doc h2+ul{margin-top:16px}
.doc h3+p,.doc h3+ul,.doc h3+.table{margin-top:8px}
.doc ul,.doc ol{padding-left:1.25em}
.doc li+li{margin-top:10px}
.doc strong{font-weight:var(--w-title)}
.doc .caps{font-size:var(--t-body);line-height:1.6}
.doc .table{overflow-x:auto}
.doc table{width:100%;border-collapse:collapse;font-size:var(--t-body);line-height:1.5}
.doc th,.doc td{text-align:left;vertical-align:top;padding:12px 20px 12px 0;border-bottom:1px solid var(--line)}
.doc th{font-weight:var(--w-title);white-space:nowrap}

footer{background:var(--soft);padding:20px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:var(--t-tiny);color:var(--ink2)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:18px}
footer a{color:var(--ink2);text-decoration:none}
footer a:hover{text-decoration:underline}
footer a[aria-current]{color:var(--ink)}

@media (max-width:900px){
  .legal{grid-template-columns:minmax(0,1fr);padding-top:32px}
  .pages{position:static;flex-direction:row;gap:20px;margin-bottom:40px}
  article{grid-column:1}
}
@media print{.bar,.pages,.toc,footer{display:none}.legal{display:block;padding:0}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="wordmark" href="/" aria-label="SimeonLabs home"></a>
    <div class="acts"><a href="/teams">Teams</a><a href="/connectors">Connectors</a><a class="btn" href="https://api.simeonlabs.com/desktop/download/mac">Download</a></div>
  </div>
</header>

<main class="wrap legal">
  <nav class="pages" aria-label="Legal"><a href="/terms"%TERMS_CURRENT%>Terms of Service</a><a href="/privacy"%PRIVACY_CURRENT%>Privacy Policy</a></nav>
  <article>
    <h1>%TITLE%</h1>
    <p class="updated">Last updated %UPDATED%</p>%TOC%
    <div class="doc">
      <p>%LEDE%</p>
%BODY%
    </div>
  </article>
</main>

<footer><div class="wrap"><span>Copyright © 2026 Spaire, Inc. All rights reserved.</span><nav><a href="/teams">Teams</a><a href="/connectors">Connectors</a><a href="/privacy"%PRIVACY_CURRENT%>Privacy</a><a href="/terms"%TERMS_CURRENT%>Terms</a><a href="mailto:%CONTACT%">Contact</a></nav></div></footer>

</body>
</html>
