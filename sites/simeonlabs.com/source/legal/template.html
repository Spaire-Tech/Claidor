<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>%TITLE% | SimeonLabs</title>
<meta name="description" content="%DESCRIPTION%">
<link rel="canonical" href="https://simeonlabs.com/%SLUG%">
<meta property="og:type" content="website">
<meta property="og:url" content="https://simeonlabs.com/%SLUG%">
<meta property="og:title" content="%TITLE% | SimeonLabs">
<meta property="og:description" content="%DESCRIPTION%">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
/* The legal pages: the home page's bar, column and footer (source/page.html), its serif for the
   titles, and a reading column beside a table of contents, as Apple's legal pages have it. Light
   only, every colour from the home page's own. Made by legal.py from legal/<page>.html. */
:root{
  --page:#fff; --soft:#f5f5f7; --panel:#fafafb; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#86868b; --line:#e5e5ea; --blue:#255a93;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --gutter:max(20px,4.6vw);
  --col:min(1260px,calc(100vw - 2 * var(--gutter)));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p,ul,ol{margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{width:var(--col);margin-inline:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;background:#000;color:#fff;font-weight:400;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
.btn:hover{background:#2b2b2d;text-decoration:none}

/* The bar, as on the home page; the name goes home. */
.bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;height:clamp(52px,3.8vw,76px)}
.bar .wordmark{--wm:clamp(118px,10.8vw,217px);display:block;width:var(--wm);margin-left:calc(var(--wm) * -85 / 1585);background:var(--ink);-webkit-mask:url(/img/wordmark-labs.png) center/contain no-repeat;mask:url(/img/wordmark-labs.png) center/contain no-repeat;aspect-ratio:1585/460}
.bar .btn{height:clamp(28px,1.9vw,38px);padding:0 clamp(12px,.8vw,16px);font-size:clamp(14px,1vw,20px)}

/* The title: the home page's serif at its section size. */
.top{padding:clamp(48px,6vw,120px) 0 clamp(28px,3vw,56px)}
.eyebrow{font-size:clamp(14px,.95vw,18px);color:var(--ink2);letter-spacing:-.01em}
.top h1{margin-top:10px;font-family:var(--serif);font-weight:400;font-size:clamp(42px,3.6vw,72px);line-height:1.02;letter-spacing:-.02em}
.dates{margin-top:18px;font-size:clamp(14px,.95vw,17px);color:var(--ink2)}
.lede{margin-top:clamp(18px,1.6vw,28px);max-width:36em;font-size:clamp(18px,1.25vw,23px);line-height:1.5;letter-spacing:-.01em;color:#3a3a3c}

/* The short version: the home page's pale panel. */
.short{padding:clamp(26px,2.6vw,48px) clamp(26px,3vw,56px);border-radius:28px;background:var(--panel)}
.short h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,1.9vw,36px);line-height:1.1;letter-spacing:-.015em}
.short ul{margin-top:clamp(16px,1.4vw,24px);padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,1.2vw,22px) clamp(24px,3vw,56px)}
.short li{position:relative;padding-left:22px;font-size:clamp(16px,1.02vw,19px);line-height:1.5;color:#3a3a3c}
.short li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.short p{margin-top:clamp(16px,1.4vw,24px);font-size:15px;color:var(--ink2)}

/* The document beside its contents. */
.cols{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:clamp(32px,5vw,96px);padding:clamp(48px,5vw,96px) 0 clamp(80px,8vw,160px)}
.toc{position:sticky;top:clamp(80px,6vw,110px);align-self:start;max-height:calc(100vh - 130px);overflow:auto;font-size:14px;line-height:1.35}
.toc p{font-weight:600;color:var(--ink);margin-bottom:12px}
.toc ol{padding:0;list-style:none;display:grid;gap:2px;counter-reset:t}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--line);color:var(--ink2);counter-increment:t}
.toc a::before{content:counter(t) ". "}
.toc a:hover{color:var(--ink);text-decoration:none}
.toc a.on{color:var(--ink);border-left-color:var(--ink)}
.doc{max-width:44em;counter-reset:s}
.doc section+section{margin-top:clamp(44px,3.6vw,64px)}
.doc h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,2vw,38px);line-height:1.1;letter-spacing:-.015em;counter-increment:s}
.doc h2::before{content:counter(s) ". ";color:var(--ink3)}
.doc h3{margin-top:28px;font-size:19px;font-weight:600;letter-spacing:-.015em}
.doc p,.doc ul,.doc ol,.doc .table{margin-top:14px;color:#3a3a3c}
.doc h2+p{margin-top:18px}
.doc ul,.doc ol{padding-left:1.3em}
.doc li+li{margin-top:8px}
.doc li::marker{color:var(--ink3)}
.doc strong{color:var(--ink);font-weight:600}
.doc .caps{font-size:15px;line-height:1.55;letter-spacing:-.005em}
.doc .table{overflow-x:auto;border-radius:18px;background:var(--panel)}
.doc table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.45}
.doc th,.doc td{text-align:left;vertical-align:top;padding:14px 18px}
.doc th{font-weight:600;color:var(--ink);white-space:nowrap}
.doc tr+tr td{border-top:1px solid var(--line)}
.doc thead th{border-bottom:1px solid var(--line)}
.other{margin-top:clamp(44px,3.6vw,64px);padding-top:28px;border-top:1px solid var(--line);font-size:17px}
.other a::after{content:" ›"}

footer{background:var(--soft);padding:20px 0 calc(40px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--ink2)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:18px}
footer a{color:var(--ink2)}
footer a[aria-current]{color:var(--ink)}

@media (max-width:900px){
  .cols{grid-template-columns:1fr;gap:0;padding-top:32px}
  .toc{position:static;max-height:none;margin-bottom:40px;padding:22px 24px;border-radius:22px;background:var(--panel)}
  .toc a{border-left:0;padding-left:0}
  .short ul{grid-template-columns:1fr}
}
@media print{.bar,.toc,footer{display:none}.cols{display:block;padding:0}.short{background:none;padding:0}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="wordmark" href="/" aria-label="SimeonLabs home"></a>
    <a class="btn" href="/">Download</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="top">
      <p class="eyebrow">Legal</p>
      <h1>%TITLE%</h1>
      <p class="dates">Effective %EFFECTIVE% · Last updated %UPDATED%</p>
      <p class="lede">%LEDE%</p>
    </div>
%SHORT%
    <div class="cols">
      <nav class="toc" aria-label="On this page"><p>On this page</p><ol>%TOC%</ol></nav>
      <article class="doc">
%BODY%
        <p class="other">%OTHER%</p>
      </article>
    </div>
  </div>
</main>

<footer><div class="wrap"><span>Copyright © 2026 Simeon Labs, Inc. All rights reserved.</span><nav><a href="/privacy"%PRIVACY_CURRENT%>Privacy</a><a href="/terms"%TERMS_CURRENT%>Terms</a><a href="mailto:%CONTACT%">Contact</a></nav></div></footer>

<script>
// The contents follow the reading: the section on screen is marked.
(() => {
  const links = new Map([...document.querySelectorAll('.toc a')].map((a) => [a.getAttribute('href').slice(1), a]));
  const seen = new Set();
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) e.isIntersecting ? seen.add(e.target.id) : seen.delete(e.target.id);
    const first = [...links.keys()].find((id) => seen.has(id));
    for (const [id, a] of links) a.classList.toggle('on', id === first);
  }, { rootMargin: '-90px 0px -55% 0px' });
  for (const id of links.keys()) { const el = document.getElementById(id); if (el) io.observe(el); }
})();
</script>
</body>
</html>
