name: Desktop app (macOS)

# Builds Simeon for Apple Silicon Macs and keeps the app as a downloadable
# artifact of the run. The app is ad-hoc signed until an Apple developer
# certificate is added, so the first launch needs a right-click, Open
# (see desktop/README.md).

# By hand only, on purpose. GitHub bills macOS runners at ten times the
# minute rate, so the 2,000 free minutes a month are really about 200
# macOS minutes and this build takes twenty. On a push trigger every
# commit touching desktop/ spent some of that, which is how the bill got
# where it did.
#
# The same build runs on a Mac for nothing: the loop in
# docs/product/building-the-app.md. Until 25 September 2026 this workflow
# still ran the LobsterAI-era steps (build-whisper.sh, npm run
# dist:mac:arm64), none of which exist in the tree; it now runs the real
# loop. Not measured: `npm run bootstrap` needs a genuine Grok Bot 0.18.0
# app, which the runner has to download from Cursor's host (403 from a
# build container on 19 September); if that step fails here, the build is
# a Mac-only build until the archive is provided another way.
on:
  workflow_dispatch:

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Hydrate the pinned 0.18.0 renderer
        run: npm run bootstrap

      - name: Typecheck and test
        run: npm run check

      - name: Package Simeon.app
        run: npm run package

      - name: Verify the bundle
        run: npm run verify

      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Simeon.app Simeon-macOS-arm64.zip

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: Simeon-macOS-arm64
          path: desktop/Simeon-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
