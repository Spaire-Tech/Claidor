name: Client

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, edited]

defaults:
  run:
    working-directory: ./clients

permissions:
  contents: read
  # `Detect changes` asks the API which files a pull request touches, and
  # without this it is refused with "Resource not accessible by
  # integration" — so the job has failed on every pull request while
  # passing on every push to main, where it reads git history instead.
  # test_server.yaml has carried the scope all along; this file was simply
  # missed.
  pull-requests: read

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.filter.outputs.clients }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            clients:
              - 'clients/**'
              - '.github/workflows/test_client.yaml'

  build:
    name: "Client: Tests 🎨"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: clients/.node-version
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 💅Lint
        run: pnpm run lint

      - name: 👀 Typecheck
        run: pnpm run typecheck

      # One `turbo run test` rather than a filter per package. The list
      # of filters had gone stale at the rebrand — every one of them named
      # `@polar-sh/…`, none of which exists any more, so all three steps
      # failed and the panel's tests were never run at all. A task that
      # picks up new packages by itself cannot go stale the same way.
      - name: 🧪 Test
        run: pnpm run test

      - name: 🛠️ Build
        run: pnpm build
