name: Windows app

# The Windows app (windows/, docs/web-app/README.md step 7) on a Windows
# runner: its tests, its typecheck, the app run for real against the
# stand-in server on the runner itself (scripts/smoke.mjs: nothing outside
# is reached), the browser in the app against a stand-in engine and test
# pages (scripts/browser-smoke.mjs) and its view and Take control in the
# app itself (scripts/browser-view-smoke.mjs), then a release's installer
# (scripts/release.mjs, without --publish: nothing is uploaded), kept as an
# artifact of the run.
#
# Two jobs:
# - `build`, from any branch, with no secret: the installer unsigned. An
#   unsigned build never updates itself (src/main/updates/feed.ts), so it
#   is safe to try.
# - `signed`, only when asked (the `sign` input), only from main, and only
#   through the `windows-release` environment, which alone holds the
#   certificate as WIN_CSC_LINK (the .pfx, in base64) and
#   WIN_CSC_KEY_PASSWORD. Set that environment up in the repository's
#   Settings › Environments: deployment branches main only, a required
#   reviewer if wanted. Every installed app accepts what this job signs, so
#   no other branch's code ever runs with the certificate.
# Publishing stays on a person's Windows PC (node scripts/release.mjs
# --publish), as the Mac's release.
#
# By hand only, as desktop_mac.yml: GitHub bills Windows runners at twice
# the Linux minute rate, and the build takes a while.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Also build a signed installer (main only, the windows-release environment)"
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # The build number is the commit count (scripts/release.mjs).
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: clients/.node-version
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Electron's own binary
        run: npm run electron:install

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Run the app against the stand-in
        run: npm run smoke

      - name: Run the browser in the app against a stand-in engine
        run: npm run browser-smoke

      - name: Run the browser's view and Take control in the app
        run: npm run browser-view-smoke

      - name: Build the installer (unsigned)
        run: node scripts/release.mjs

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Simeon-Windows-x64-unsigned
          path: windows/out/release/
          if-no-files-found: error
          retention-days: 14

  signed:
    needs: build
    if: ${{ inputs.sign && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment: windows-release
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: clients/.node-version
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the installer, signed, its signature checked as the app checks it
        run: node scripts/release.mjs
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Simeon-Windows-x64
          path: windows/out/release/
          if-no-files-found: error
          retention-days: 14
