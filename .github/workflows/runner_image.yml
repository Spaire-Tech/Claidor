name: Runner image

# Builds the cloud runner's image — the OpenClaw engine at the pinned tag,
# with the desktop app's patches applied, plus the runner service — and
# publishes it to GHCR. Render pulls that image instead of building it: the
# engine build is 152 workspace projects and Render's build machine hangs at
# `tsdown` rather than finishing it (docs/maties/cloud.md, section 4).
#
# The whole build is the Dockerfile, run here. Cloning, patching and building
# the engine on this machine and copying the result in would be a second way
# of doing it, and the two would drift; `runner/Dockerfile` stays the one
# description of the image, and a developer's `docker build` produces the same
# thing this run does.
#
# Render does not redeploy when a new image is pushed to a tag — autoDeploy
# has no effect on an image-backed service — so after a green run the deploy
# is one click: Render → claidor-maty-runner → Manual Deploy → Deploy latest
# reference.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner/**"
      # A patch added to the desktop is a change to the cloud engine, even
      # though nothing under runner/ moved. Without this line the next patch
      # would never reach the cloud and nobody would be told.
      - "desktop/scripts/patches/**"
      - ".github/workflows/runner_image.yml"

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # GitHub's own token pushes to GHCR under this repository's owner.
      # There is no registry secret to keep anywhere.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The runner's tests are where the pin is checked: same engine version
      # as the desktop, same repository, same patch set reaching the image.
      # They run before the build so a drifted pin costs a minute rather than
      # an hour, and so no image is published from a tree that fails them.
      - name: Check the engine pin
        working-directory: runner
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/spaire-tech/claidor-maty-runner
          # The commit sha names one exact image forever; `main` is what
          # render.yaml deploys and moves with this branch.
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # The repository root, because the engine patches live under
          # desktop/. `.dockerignore` at the root keeps that honest.
          context: .
          file: runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The engine stage copies only the patches and the desktop's pin, so
          # a change to the runner's own source restores it from cache instead
          # of rebuilding openclaw for an hour.
          cache-from: type=gha,scope=runner-image
          cache-to: type=gha,mode=max,scope=runner-image
