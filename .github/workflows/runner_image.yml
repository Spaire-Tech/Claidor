name: Runner image

# Publishes the cloud runner's image to GHCR, by hand only.
#
# Render no longer pulls this image: since 25 September 2026 `render.yaml`
# has Render build `claidor-maty-runner` from the repository
# (`runtime: docker`, `runner/Dockerfile`, context the repository root),
# because the OpenClaw engine that made the image too heavy for Render's
# build machine is gone from the runner (`runner/src/engine.ts`). Until 26
# September this workflow still described that engine build, ran on every
# push to `main` touching `runner/**`, and watched `desktop/scripts/patches/**`,
# a folder that left the tree with the 18 September re-founding (ledger
# F-456). It is kept as a way to publish a tagged image for a deploy target
# that is not Render; nothing depends on it, and the repository's own
# workflows get no runner while Actions is billing-locked (CLAUDE.md, "On
# CI").
#
# The whole build is the Dockerfile, run here, so a developer's
# `docker build -f runner/Dockerfile .` produces the same image.

on:
  workflow_dispatch:

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # GitHub's own token pushes to GHCR under this repository's owner.
      # There is no registry secret to keep anywhere.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The same major the Dockerfile builds on (node:24).
          node-version: "24"

      # The runner's own tests (the queue client, the one-turn engine against
      # an in-process fake proxy) run before the build so no image is
      # published from a tree that fails them.
      - name: Test the runner
        working-directory: runner
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/spaire-tech/claidor-maty-runner
          # The commit sha names one exact image forever; `main` follows the
          # default branch.
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # The repository root, the context render.yaml passes too.
          context: .
          file: runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner-image
          cache-to: type=gha,mode=max,scope=runner-image
