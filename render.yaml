# Claidor on Render — infrastructure as a blueprint.
#
# Create with: Render dashboard → New → Blueprint → point at this repo.
# Everything here is Claidor's own: a matter's documents and a client's
# confidential file never share a database or a bucket with another product.
#
# Secrets are deliberately NOT in this file. Every `sync: false` value is
# entered once in the Render dashboard and never committed.
#
# Shared configuration lives in the `claidor-shared` env var group declared
# at the bottom of this file, so the API and the worker cannot drift apart.
# Database and Redis links must stay inline per service: env var groups hold
# literal values only, not `fromDatabase` / `fromService` references.

services:
  - type: web
    name: claidor-api
    runtime: docker
    repo: https://github.com/Spaire-Tech/Claidor
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVarGroups:
      - claidor-shared
    envVars:
      # Run alembic on boot so a deploy that adds a table needs no manual
      # step. ONLY the web service does this — see the worker below.
      - key: CLAIDOR_MIGRATE_ON_STARTUP
        value: "true"

      # The cloud runner's service token. This service is the one that
      # checks it, and claidor-maty-runner is the one that sends it, so the
      # same value goes in both places and nowhere else. Left unset here,
      # every runner request is refused and the queue never moves. It is
      # not in the claidor-shared group on purpose: the runner must not
      # join that group, because it carries keys the runner has no business
      # holding. See docs/maties/cloud.md, section 4.
      - key: CLAIDOR_MATY_RUNNER_TOKEN
        sync: false

      # --- database (Render-managed, Claidor's own) ---
      - key: CLAIDOR_POSTGRES_HOST
        fromDatabase: { name: claidor-postgres, property: host }
      - key: CLAIDOR_POSTGRES_PORT
        fromDatabase: { name: claidor-postgres, property: port }
      - key: CLAIDOR_POSTGRES_USER
        fromDatabase: { name: claidor-postgres, property: user }
      - key: CLAIDOR_POSTGRES_PWD
        fromDatabase: { name: claidor-postgres, property: password }
      - key: CLAIDOR_POSTGRES_DATABASE
        fromDatabase: { name: claidor-postgres, property: database }
      # The app also opens a read pool; same instance until there is a replica.
      - key: CLAIDOR_POSTGRES_READ_HOST
        fromDatabase: { name: claidor-postgres, property: host }
      - key: CLAIDOR_POSTGRES_READ_PORT
        fromDatabase: { name: claidor-postgres, property: port }
      - key: CLAIDOR_POSTGRES_READ_USER
        fromDatabase: { name: claidor-postgres, property: user }
      - key: CLAIDOR_POSTGRES_READ_PWD
        fromDatabase: { name: claidor-postgres, property: password }
      - key: CLAIDOR_POSTGRES_READ_DATABASE
        fromDatabase: { name: claidor-postgres, property: database }

      # --- redis ---
      - key: CLAIDOR_REDIS_HOST
        fromService: { name: claidor-redis, type: keyvalue, property: host }
      - key: CLAIDOR_REDIS_PORT
        fromService: { name: claidor-redis, type: keyvalue, property: port }

  - type: worker
    name: claidor-worker
    runtime: docker
    repo: https://github.com/Spaire-Tech/Claidor
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    autoDeploy: true
    dockerCommand: uv run dramatiq -p 2 -t 4 -f polar.worker.scheduler:start polar.worker.run
    envVarGroups:
      - claidor-shared
    envVars:
      # Never on the worker: two processes running alembic at once is how
      # you get a half-applied schema.
      - key: CLAIDOR_MIGRATE_ON_STARTUP
        value: "false"

      - key: CLAIDOR_POSTGRES_HOST
        fromDatabase: { name: claidor-postgres, property: host }
      - key: CLAIDOR_POSTGRES_PORT
        fromDatabase: { name: claidor-postgres, property: port }
      - key: CLAIDOR_POSTGRES_USER
        fromDatabase: { name: claidor-postgres, property: user }
      - key: CLAIDOR_POSTGRES_PWD
        fromDatabase: { name: claidor-postgres, property: password }
      - key: CLAIDOR_POSTGRES_DATABASE
        fromDatabase: { name: claidor-postgres, property: database }
      - key: CLAIDOR_POSTGRES_READ_HOST
        fromDatabase: { name: claidor-postgres, property: host }
      - key: CLAIDOR_POSTGRES_READ_PORT
        fromDatabase: { name: claidor-postgres, property: port }
      - key: CLAIDOR_POSTGRES_READ_USER
        fromDatabase: { name: claidor-postgres, property: user }
      - key: CLAIDOR_POSTGRES_READ_PWD
        fromDatabase: { name: claidor-postgres, property: password }
      - key: CLAIDOR_POSTGRES_READ_DATABASE
        fromDatabase: { name: claidor-postgres, property: database }

      - key: CLAIDOR_REDIS_HOST
        fromService: { name: claidor-redis, type: keyvalue, property: host }
      - key: CLAIDOR_REDIS_PORT
        fromService: { name: claidor-redis, type: keyvalue, property: port }

  # The cloud runner for Maties (docs/maties/cloud.md, section 4): it takes
  # one job at a time off /maty/runner/claim, does it with the agent engine
  # the desktop app ships — the same tag, carrying the same patches — and
  # reports the answer back. It is a worker, not a web service — nothing
  # calls it, it calls us — so it has no port and no health check path.
  #
  # Alone among the services here it is not built by Render. The engine is
  # 152 workspace projects and Render's build machine hangs at `tsdown`
  # rather than finishing; worse, a build here could not reach the patches
  # under desktop/, so it would quietly run a different engine from the one
  # on the person's computer. GitHub Actions builds the image with the
  # patches applied (.github/workflows/runner_image.yml) and this pulls it.
  #
  # A push to the registry does NOT deploy: autoDeploy has no effect on an
  # image-backed service, so a new image goes out through Manual Deploy →
  # Deploy latest reference, or the service's deploy hook. That is a real
  # manual step and it is written here rather than left to be discovered.
  #
  # The image is PUBLIC on GHCR, by the founder's decision of September 11,
  # so there is no `creds` line and Render needs no registry credential.
  #
  # What that publishes, said plainly: the built engine, our patches to it,
  # and the runner's compiled source. What it does not publish is any
  # secret, and that is a property to keep rather than assume. The image
  # carries no ENV or ARG holding a credential; the runner's own token and
  # every other value it needs are read from the environment at run time
  # (`runner/src/settings.ts`), which Render supplies and the registry never
  # sees. Anything that would bake a secret into a layer must make this
  # image private again, and `creds` returns with it.
  #
  # It touches neither the database nor Redis: everything it needs it asks
  # the API for, and the only lasting credential it holds is its own
  # service token. The person's own token is minted per job and dies with
  # the lease.
  - type: worker
    name: claidor-maty-runner
    runtime: image
    image:
      # The moving tag the workflow pushes on every green build of main. Each
      # build also carries its commit sha, so a bad deploy rolls back by
      # pointing a manual deploy at `...@sha256:` or the sha tag instead.
      url: ghcr.io/spaire-tech/claidor-maty-runner:main
    plan: starter
    # Deliberately NOT in the `claidor-shared` group, unlike the two
    # services above. That group carries the provider key, the signing
    # secrets and the S3 credentials, and this service needs none of them:
    # every model call it makes goes through the API's metered proxy on the
    # person's own token, and it stores nothing anywhere. Joining the group
    # for tidiness would hand a stolen runner the keys to everything, which
    # is the opposite of what docs/maties/cloud.md promises. It holds two
    # values and no more.
    envVars:
      # Where to claim jobs, fetch the person's memory, and call the model
      # proxy. The same address the desktop app uses.
      - key: CLAIDOR_API_BASE_URL
        value: https://api.claidor.com

      # The service's own token, which belongs to no person. Generated once
      # and pasted into the dashboard, like every other secret here. The
      # API knows it as CLAIDOR_MATY_RUNNER_TOKEN too; the two must match.
      - key: CLAIDOR_MATY_RUNNER_TOKEN
        sync: false

  - type: keyvalue
    name: claidor-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: claidor-postgres
    databaseName: claidor
    plan: basic-256mb
    postgresMajorVersion: "16"

# Everything both processes must agree on. Render prompts once for each
# `sync: false` value when the blueprint is applied.
envVarGroups:
  - name: claidor-shared
    envVars:
      - key: CLAIDOR_ENV
        value: production
      - key: CLAIDOR_LOG_LEVEL
        value: INFO
      - key: CLAIDOR_REDIS_DB
        value: "0"

      # --- URLs and cookies ---
      - key: CLAIDOR_BASE_URL
        value: https://api.claidor.com
      - key: CLAIDOR_FRONTEND_BASE_URL
        value: https://app.claidor.com
      # JSON arrays — a comma-separated value makes the app refuse to start.
      - key: CLAIDOR_ALLOWED_HOSTS
        value: '["api.claidor.com","app.claidor.com"]'
      - key: CLAIDOR_CORS_ORIGINS
        value: '["https://app.claidor.com"]'
      # The leading dot is what makes the session valid across app. and api.
      - key: CLAIDOR_USER_SESSION_COOKIE_DOMAIN
        value: .claidor.com

      # --- secrets (generated once, pasted here) ---
      - key: CLAIDOR_SECRET
        sync: false
      - key: CLAIDOR_S3_FILES_DOWNLOAD_SECRET
        sync: false
      - key: CLAIDOR_JWKS
        sync: false
      - key: CLAIDOR_CURRENT_JWK_KID
        value: claidor_prod

      # --- the librarian, and the desktop app's models ---
      # Both suppliers the model proxy serves (docs/maties/models-and-search.md).
      # One key each, held here and never by the app: Maties has no
      # API-key screen. An empty key is not an outage — the models it
      # would serve are simply not offered in the app's model list.
      - key: CLAIDOR_ANTHROPIC_API_KEY
        sync: false
      - key: CLAIDOR_OPENAI_API_KEY
        sync: false

      # --- sign-in ---
      - key: CLAIDOR_GOOGLE_CLIENT_ID
        sync: false
      - key: CLAIDOR_GOOGLE_CLIENT_SECRET
        sync: false

      # --- connections (docs/maties/connectors.md) ---
      # The middleman that holds the sign-in plumbing for the services a
      # person connects an account to. The client secret buys a developer
      # token that is project-wide: it can reach every customer's
      # accounts, which is why it is only ever minted on the API and why
      # claidor-maty-runner above is not in this group.
      - key: CLAIDOR_PIPEDREAM_CLIENT_ID
        sync: false
      - key: CLAIDOR_PIPEDREAM_CLIENT_SECRET
        sync: false
      - key: CLAIDOR_PIPEDREAM_PROJECT_ID
        sync: false
      # "development" is free and capped at ten people; switch to
      # "production" when there are more than ten, and expect the bill.
      - key: CLAIDOR_PIPEDREAM_ENVIRONMENT
        value: development

      # Who may use connections before there is a plan to buy. Connections
      # are a paid feature (docs/maties/connectors.md, section 5), and the
      # paid plans do not exist until step 9, so WITHOUT THIS NOBODY IS
      # ENTITLED AND EVERY CONNECTOR ROUTE ANSWERS 402 — including yours.
      # A JSON array of email addresses, not a comma-separated one:
      #   ["you@example.com"]
      - key: CLAIDOR_CONNECTORS_ENTITLED_EMAILS
        sync: false

      # --- storage: Claidor's own buckets, never shared ---
      - key: CLAIDOR_AWS_ACCESS_KEY_ID
        sync: false
      - key: CLAIDOR_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLAIDOR_AWS_REGION
        value: eu-west-3
      - key: CLAIDOR_S3_FILES_BUCKET_NAME
        value: claidor-files
      - key: CLAIDOR_S3_FILES_PUBLIC_BUCKET_NAME
        value: claidor-files-public

      # --- email (login codes, alerts later) ---
      # Start with `logger` to get the app up without Resend; switch to
      # `resend` once the sending domain is verified.
      - key: CLAIDOR_EMAIL_SENDER
        value: logger
      - key: CLAIDOR_RESEND_API_KEY
        sync: false
      - key: CLAIDOR_EMAIL_FROM_NAME
        value: Claidor
      - key: CLAIDOR_EMAIL_FROM_DOMAIN
        value: claidor.com
