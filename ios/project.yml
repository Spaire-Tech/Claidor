# Simeon on the iPhone, native (SwiftUI). XcodeGen makes Simeon.xcodeproj
# from this file (`xcodegen generate`, ios/README.md); the project itself is
# not kept in git.
name: Simeon
options:
  bundleIdPrefix: com.simeonlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Raised for each upload to App Store Connect (build 1 was refused at
    # processing, 12 October 2026: no camera description, ITMS-90683;
    # build 3: the agents' faces; build 4: the free month, Google in the
    # app, the short first run, Face ID, the simpler plans; build 5: pushes
    # as messages from the agents, the notifications switch, the account
    # page with Delete Account).
    CURRENT_PROJECT_VERSION: "14"
    CODE_SIGN_STYLE: Automatic
    # The Apple developer team Simeon publishes from: set it here, or in
    # Xcode under Signing & Capabilities, once (ios/README.md).
    DEVELOPMENT_TEAM: "496QXRMJXG"
packages:
  SimeonCore:
    path: SimeonCore
  # The call's voice: ElevenLabs' own iPhone kit (WebRTC through LiveKit), the
  # same conversation the Mac's banner runs with their web kit.
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    from: 3.4.0
  # LiveKit, the kit under ElevenLabs': named so the app can tell it to let go
  # of the microphone when a call is over (Simeon/CallAudio.swift). The same
  # package ElevenLabs' kit already brings, so one copy is built.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.10.0
targets:
  Simeon:
    type: application
    platform: iOS
    sources:
      - path: Simeon
        excludes: ["Computer/**", "Rendering/**"]
      # noVNC's client (MPL 2.0) and its licence, read at run time by the
      # computer view (Computer.swift), so they ship as files.
      - path: Simeon/Computer
        buildPhase: resources
      # Mermaid and KaTeX (MIT) and their licences, for the chat's diagrams
      # and maths (Rendering.swift; scripts/make-renderers.sh fetches them).
      - path: Simeon/Rendering
        buildPhase: resources
      # The agents' pictures, shared with the notification extension.
      - path: SimeonNotifications/PictureShelf.swift
    dependencies:
      - package: SimeonCore
      - package: ElevenLabs
      - package: LiveKit
      # Each push shown as a message from its agent, with the agent's picture.
      - target: SimeonNotifications
        embed: true
    info:
      path: Simeon/Info.plist
      properties:
        CFBundleDisplayName: Simeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The phone's own scheme: the Mac app owns `simeon`, and the
        # server's confirm page opens `simeon-ios://app/v1/open`.
        CFBundleURLTypes:
          - CFBundleURLName: com.simeonlabs.simeon.ios
            CFBundleURLSchemes: [simeon-ios]
        UILaunchScreen:
          UIColorName: Ground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # The composer's mic (dictation) and voice calls with an agent.
        NSMicrophoneUsageDescription: Simeon listens when you dictate a message or call an agent.
        NSSpeechRecognitionUsageDescription: Simeon turns what you say into the message you are writing.
        NSPhotoLibraryUsageDescription: Simeon sends the photos you pick to your agent.
        # Never asked: the app has no camera feature, but the calls' voice kit
        # (LiveKit, under ElevenLabs' kit) links camera code, and App Store
        # Connect refuses a build without this line (ITMS-90683).
        NSCameraUsageDescription: Simeon's calls with your agents are voice only and never turn on the camera.
        # The lock the person may turn on in the first run or Settings (AppLock.swift).
        NSFaceIDUsageDescription: Simeon uses Face ID to unlock the app, so only you can see your agents.
        # A call keeps going with the screen locked.
        UIBackgroundModes: [audio]
        # Pushes shown as messages from the agents (SimeonNotifications):
        # Apple's communication notifications take this intent.
        NSUserActivityTypes: [INSendMessageIntent]
        # Loopback and the local network over http, for a build pointed at
        # the stand-in server on a Mac (`SIMEON_API`, ios/README.md).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # The same app as the retired Expo shell's (removed 11 October 2026),
        # so the native build replaces it on TestFlight and the App Store.
        PRODUCT_BUNDLE_IDENTIFIER: com.simeonlabs.simeon.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Push notifications (Notifications.swift). Xcode's automatic
        # signing switches the App ID's Push capability on from this, and an
        # archive for TestFlight signs it as `production` itself. Also the
        # Communication Notifications capability and the App Group the
        # notification extension reads the agents' pictures from.
        CODE_SIGN_ENTITLEMENTS: Simeon/Simeon.entitlements
  # The notification extension (12 October 2026): every push as a message
  # from the agent who sent it, its picture beside it and the app's icon in
  # the corner (NotificationService.swift). Pictures come from the App Group
  # the app writes them to (PictureShelf.swift).
  SimeonNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: SimeonNotifications
        excludes: ["*.entitlements"]
    info:
      path: SimeonNotifications/Info.plist
      properties:
        CFBundleDisplayName: Simeon Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simeonlabs.simeon.ios.notifications
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SimeonNotifications/SimeonNotifications.entitlements
schemes:
  Simeon:
    build:
      targets:
        Simeon: all
    # Run (⌘R) builds Release, optimised as TestFlight's and the App Store's are: Debug's unoptimised Swift made every
    # tap, layout and chat open several times slower than what people get, and the app felt heavy from Xcode.
    run:
      config: Release
    archive:
      config: Release
