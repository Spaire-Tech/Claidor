<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:845},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bass&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ROLES = [
  ["Finance", "Numbers, then. I'll keep receipts on everything I hand you."],
  ["Engineering / Tech", "Right. I'll stay literal and leave the detail in."],
  ["Founder / Business Owner", "Thought so. I'll keep things short and decision-shaped."],
  ["Sales / Marketing", "Pipeline work. I'll keep you in front of people instead of admin."],
  ["Office Work", "The stuff nobody thanks you for. That's the easiest to take off you."],
  ["Content Creator", "Output work. I'll keep the drafts moving so you're never starting cold."],
  ["Design / Creative", "Fine. I'll keep the output visual where that helps."],
  ["Consultant / Freelance", "Many masters. I'll keep the clients from blurring into each other."],
  ["Student", "Deadlines and reading. I can carry most of that."],
  ["Slacker (my kind)", "Ha. My kind of client. We'll find you agents who work while you don't."]
];
const OTHER_REPLY = "Noted. I'll work out the shape of it as we go.";

const TASKS = [
  ["apple-notes.webp", "Leave a riddle on your note app", "Notes",
   "App access requested",
   "I can do that, but I'll need access to Notes to write it in there. Mind allowing that?",
   "Done. I left one in Notes. Try opening it.",
   "A riddle from Yodo", "Note", "Open in Notes"],
  ["macos-settings.png", "Change my theme to dark mode", "System Settings",
   "System access requested",
   "Easy enough. I'll need permission to change your system appearance. Mind allowing that?",
   "Done. Have a look around \u2014 everything just went dark.",
   "Appearance \u2014 Dark", "System setting", "Open in Settings"],
  ["imessage.webp", "Text myself a pep talk for 9am tomorrow", "Messages",
   "App access requested",
   "Can do. I'll need access to Messages to send it to you in the morning. Mind allowing that?",
   "Done. It'll land at nine, whether you're ready for it or not.",
   "Pep talk \u2014 9:00 AM", "Scheduled message", "Open in Messages"]
];

const AGENTS = [
  ["Perrin", "Reads files and answers with the numbers", "#f7c9a8,#f4b9b0,#efd3a8", 12],
  ["Juno", "Handles documents, decks and exports", "#8fd3f4,#b9c4ee,#f7b2d9", 2],
  ["Sable", "Keeps filing, naming and versions in order", "#cdbdf5,#e3c2ee,#f9cfd6", 7]
];

const RES = (p) => {
  const id = "logo_" + p.replace(/^.*\//, "").replace(/\.[a-z0-9]+$/i, "").replace(/[^a-z0-9]/gi, "_");
  return (window.__resources && window.__resources[id]) || p;
};

const WPS = 13;
const GAP = 3;
const WORD_ON = "display:inline; animation:wordIn .3s ease-out both";
const WORD_OFF = "display:inline";
const INTRO_MS = 2150;

class Component extends DCLogic {
  scrollRef = React.createRef();
  born = Date.now();
  state = { signedIn: true, intro: true, phase: null, t0: null, revealed: 0, role: null, other: "", otherOpen: false, task: null, perm: null, agent: 0 };

  componentDidMount() { this.timer = setInterval(() => this.frame(), 16); }
  componentWillUnmount() { clearInterval(this.timer); }

  componentDidUpdate() {
    if (this._seen === this.state.revealed && this._seenPhase === this.state.phase) return;
    this._seen = this.state.revealed;
    this._seenPhase = this.state.phase;
    const el = this.scrollRef.current;
    if (el && el.scrollHeight - el.clientHeight - el.scrollTop < 260) el.scrollTop = el.scrollHeight;
  }

  frame() {
    const s = this.state;
    if (!s.signedIn) return;
    if (s.intro) {
      if (Date.now() - this.born > INTRO_MS) this.begin("open");
      return;
    }
    if (!s.phase || s.t0 == null) return;
    const total = this.segs(s.phase).total;
    const n = Math.min(total, Math.floor(((Date.now() - s.t0) / 1000) * WPS));
    if (n !== s.revealed) this.setState({ revealed: n });
  }

  begin(phase) { this.setState({ intro: false, phase: phase, t0: Date.now(), revealed: 0 }); }

  lines(phase) {
    const s = this.state;
    if (phase === "role") return [
      s.role === "other" ? OTHER_REPLY : (ROLES[s.role] ? ROLES[s.role][1] : ""),
      "Here on your Mac I work directly with your files, your folders, and the apps you connect.",
      "Start with something small to see how it feels:"
    ];
    if (phase === "perm") return [
      TASKS[s.task] ? TASKS[s.task][4] : ""
    ];
    if (phase === "task") {
      const t = TASKS[s.task];
      if (s.perm !== "allowed") return [
        "No bother. I'll ask again when it actually matters.",
        "We can get you moving without it.",
        "You're all set."
      ];
      return [
        t ? t[5] : "",
        "And just like that, we did something on your computer.",
        "You're all set."
      ];
    }
    return [
      "Hey, " + ((this.props.userName || "Bass").trim() || "Bass") + "!",
      "My name is Yodo. I'm your Chief of Staff.",
      "My job is simple: figure out what you need done, then put the right agents on it. You can work with them yourself, or let me run the team for you.",
      "Right now you've got nobody. By the time we're done here you'll have two or three, and they'll already be working.",
      "So talk to me. Which best describes your work?"
    ];
  }

  words(text) {
    return text.split(" ").map((w, i) => (i ? " " + w : w));
  }

  segs(phase) {
    let off = 0;
    const out = this.lines(phase).map(text => {
      const ws = this.words(text);
      const seg = { words: ws, off: off };
      off += ws.length + GAP;
      return seg;
    });
    return { out: out, total: off };
  }

  renderVals() {
    if (!this.timer) this.timer = setInterval(() => this.frame(), 16);
    const s = this.state;
    const isOther = s.role === "other";
    const role = (s.role !== null && !isOther) ? ROLES[s.role] : null;
    const task = s.task !== null ? TASKS[s.task] : null;
    const stage = s.task !== null ? 2 : (s.role !== null ? 1 : 0);

    const cut = (phase, k) => {
      const segs = this.segs(phase).out;
      const ws = segs[k].words;
      if (s.phase !== phase) {
        return s.intro ? [] : ws.map(t => ({ text: t, style: WORD_OFF }));
      }
      const n = s.revealed - segs[k].off;
      if (n <= 0) return [];
      return ws.slice(0, Math.min(n, ws.length)).map(t => ({ text: t, style: WORD_ON }));
    };
    const done = phase => s.phase !== phase ? !s.intro : s.revealed >= this.segs(phase).total;

    return {
      showLogin: !s.signedIn,
      signedIn: s.signedIn,
      signIn: () => { this.born = Date.now(); this.setState({ signedIn: true }); },
      introRunning: s.intro,
      introDone: !s.intro,
      speakerColors: "#8ec9f0,#a9b8ea,#bfe0f5",
      speakerSeed: 22,
      scrollRef: this.scrollRef,

      wGreeting: cut("open", 0),
      wL1: cut("open", 1),
      wL2: cut("open", 2),
      wL3: cut("open", 3),
      wL4: cut("open", 4),

      showChips: s.role === null && !s.intro && done("open"),
      hasRole: s.role !== null,
      roleLabel: isOther ? s.other.trim() : (role ? role[0] : ""),
      roles: ROLES.map((x, n) => ({ label: x[0], pick: () => { this.setState({ role: n }); this.begin("role"); } })),
      chipsOpen: !s.otherOpen,
      otherOpen: s.otherOpen,
      other: s.other,
      openOther: () => this.setState({ otherOpen: true }),
      closeOther: () => this.setState({ otherOpen: false, other: "" }),
      onOther: e => this.setState({ other: e.target.value }),
      onOtherKey: e => {
        if (e.key === "Enter" && this.state.other.trim()) { this.setState({ role: "other", otherOpen: false }); this.begin("role"); }
        if (e.key === "Escape") this.setState({ otherOpen: false, other: "" });
      },
      submitOther: () => { if (this.state.other.trim()) { this.setState({ role: "other", otherOpen: false }); this.begin("role"); } },
      otherSubmitStyle: "height:42px; padding:0 22px; border-radius:999px; border:none; font-family:inherit; font-size:15.5px; font-weight:400; white-space:nowrap; cursor:pointer; transition:background .15s; background:" +
        (s.other.trim() ? "#1e3358" : "#c4ccd8") + "; color:#fbfbfc;",

      wR1: cut("role", 0),
      wR2: cut("role", 1),
      wR3: cut("role", 2),

      showTasks: s.role !== null && done("role"),
      hasTask: s.task !== null,
      taskLabel: task ? task[1] : "",
      tasks: TASKS.map((x, n) => {
        const chosen = s.task === n;
        const dim = s.task !== null && !chosen;
        return {
          label: x[1],
          pick: () => { if (this.state.task === null) { this.setState({ task: n, perm: null }); this.begin("perm"); } },
          cardStyle: "display:flex; flex-direction:column; align-items:flex-start; gap:26px; min-height:152px; padding:20px; border-radius:16px; text-align:left; font-family:inherit; transition:background .18s, border-color .18s, opacity .18s; cursor:" +
            (s.task === null ? "pointer" : "default") + "; background:" +
            (chosen ? "#eef1f5" : "#fbfbfc") + "; border:1.5px solid " + (chosen ? "#1e3358" : "rgba(16,22,35,.11)") +
            "; opacity:" + (dim ? ".42" : "1") + ";" + (chosen || dim ? "" : " box-shadow:0 1px 2px rgba(16,22,35,.04), 0 10px 28px rgba(16,22,35,.06);"),
          iconStyle: "width:46px; height:46px; flex:0 0 auto; border-radius:10px; background-image:url(" + RES("logos/apps/" + x[0]) + "); background-size:contain; background-repeat:no-repeat; background-position:center"
        };
      }),

      wP1: cut("perm", 0),
      showPerm: s.task !== null && s.perm === null && done("perm"),
      permTitle: task ? task[2] : "",
      permSub: task ? task[3] : "",
      permIconStyle: task
        ? "width:44px; height:44px; flex:0 0 auto; border-radius:11px; background-image:url(" + RES("logos/apps/" + task[0]) + "); background-size:contain; background-repeat:no-repeat; background-position:center"
        : "width:44px; height:44px; flex:0 0 auto",
      allow: () => { this.setState({ perm: "allowed" }); this.begin("task"); },
      deny: () => { this.setState({ perm: "declined" }); this.begin("task"); },

      hasPerm: s.perm !== null,
      wT1: cut("task", 0),
      wT2: cut("task", 1),
      wT3: cut("task", 2),
      showResult: s.perm === "allowed" && s.phase === "task" &&
        s.revealed >= (this.segs("task").out[1] ? this.segs("task").out[1].off : 0),
      resultName: task ? task[6] : "",
      resultKind: task ? task[7] : "",
      resultOpen: task ? task[8] : "",
      resultIconStyle: task
        ? "width:44px; height:44px; flex:0 0 auto; border-radius:11px; background-image:url(" + RES("logos/apps/" + task[0]) + "); background-size:contain; background-repeat:no-repeat; background-position:center"
        : "width:44px; height:44px; flex:0 0 auto",
      showAgents: s.perm !== null && done("task"),
      showSkip: !(s.perm !== null && done("task")),

      dots: [0, 1, 2].map(n => ({
        style: "width:" + (n === stage ? "22px" : "14px") + "; height:5px; border-radius:999px; transition:width .22s ease, background .22s ease; background:" +
          (n === stage ? "#1e3358" : "rgba(16,22,35,.16)")
      })),

      skip: () => {
        const phase = this.state.phase || "open";
        const total = this.segs(phase).total;
        this.setState({ intro: false, phase: phase, t0: Date.now() - ((total / WPS) * 1000) - 800, revealed: total });
      }
    };
  }
}
</script>
